              sys.exit("pacote corrompido ao colar: sha256 " + got + " (esperado " + want + ")")
          tf = tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz")
          try:
              tf.extractall(".", filter="data")
          except TypeError:
              tf.extractall(".")
          print("pacote ok: ios/ extraida,", len(tf.getnames()), "itens")
          PY
          rm ios-port.b64
          find ios -type f | sort

      - name: Conferir que os patches se aplicam a este projeto (numa copia)
        run: |
          rm -rf ../ios-check
          cp -r . ../ios-check
          cd ../ios-check
          bash ios/scripts/apply.sh

      - name: Guardar a pasta ios/ no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if git diff --cached --quiet; then
            echo "a pasta ios/ ja esta no repositorio, sem mudancas"
          else
            git commit -m "Port para iOS: codigo organizado em ios/ (patches, fontes e scripts)"
            git push
          fi

      - name: Zip dos arquivos para guardar fora do GitHub
        run: zip -qr ios-port-source.zip ios

      - uses: actions/upload-artifact@v4
        with:
          name: ios-port-source
          path: ios-port-source.zip
