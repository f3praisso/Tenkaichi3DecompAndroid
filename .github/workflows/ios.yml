name: ios

on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BT3_CC: ios64
      BT3_SKELETON: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Ferramentas (Homebrew)
        run: |
          mkdir -p logs
          brew install llvm spirv-cross shaderc cmake 2>&1 | tee logs/brew.txt
          brew info --json=v2 sdl3 | python3 -c "import json,sys; print(json.load(sys.stdin)['formulae'][0]['versions']['stable'])" | tee logs/sdl_version.txt
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Ambiente Python (libclang para o ptr32.py)
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --quiet --disable-pip-version-check "libclang==18.1.1"
          .venv/bin/python -c "import clang.cindex as c; c.Index.create(); print('libclang ok')"

      - name: Aplicar as mudancas (variante ios64 e contorno do leitor de tela)
        run: |
          cat > patch_ios.py <<'EOF'
          import pathlib, sys

          ROOT = pathlib.Path(".")
          ok = True

          def edit(path, pairs):
              global ok
              p = ROOT / path
              t = p.read_text()
              for old, new in pairs:
                  if t.count(old) != 1:
                      print(f"ANCORA NAO ENCONTRADA em {path} ({t.count(old)} vezes): {old[:90]!r}")
                      ok = False
                      continue
                  t = t.replace(old, new)
              p.write_text(t)

          edit("port/tools/toolchain.py", [
              ('MAC = VARIANT == "mac64"',
               'IOS = VARIANT == "ios64"\nMAC = VARIANT in ("mac64", "ios64")'),
              ('BITS64 = VARIANT in ("clang64", "win64", "mac64")',
               'BITS64 = VARIANT in ("clang64", "win64", "mac64", "ios64")'),
              ('MAC_TRIPLE = "arm64-apple-macos11"',
               'MAC_TRIPLE = "arm64-apple-ios14.0" if IOS else "arm64-apple-macos11"'),
              ('return subprocess.run(["xcrun", "--show-sdk-path"], capture_output=True, text=True).stdout.strip()',
               'return subprocess.run(["xcrun"] + (["--sdk", "iphoneos"] if IOS else []) + ["--show-sdk-path"], capture_output=True, text=True).stdout.strip()'),
              ('"port/build/obj_data_mac64" if MAC else',
               '"port/build/obj_data_ios64" if IOS else "port/build/obj_data_mac64" if MAC else'),
              ('"mac64": "bt3_mac"}', '"mac64": "bt3_mac", "ios64": "bt3_ios"}'),
          ])

          edit("port/tools/undefined.py", [
              ('from toolchain import VARIANT, WIN, MAC, BITS64, PREFIX, CLANG_TARGET, OBJ, DATA, sdl3, llvm',
               'from toolchain import VARIANT, WIN, MAC, IOS, MAC_TRIPLE, BITS64, PREFIX, CLANG_TARGET, OBJ, DATA, sdl3, llvm'),
              ('MAC_LLC = ["-mtriple=arm64-apple-macos11", ',
               'MAC_LLC = [f"-mtriple={MAC_TRIPLE}", '),
              ('target = CLANG_TARGET if soft else ["-arch", "arm64", "-mmacosx-version-min=11.0", f"-I{os.environ.get(\'BT3_SDL3\', \'/opt/homebrew/opt/sdl3\')}/include"]',
               'target = CLANG_TARGET if soft else (["-arch", "arm64", "-isysroot", CLANG_TARGET[-1], "-miphoneos-version-min=14.0"] if IOS else ["-arch", "arm64", "-mmacosx-version-min=11.0"]) + [f"-I{os.environ.get(\'BT3_SDL3\', \'/opt/homebrew/opt/sdl3\')}/include"]'),
              ('["spirv-cross", "--msl", "--msl-version", "20100", "--msl-decoration-binding",',
               '["spirv-cross", "--msl"] + (["--msl-ios"] if IOS else []) + ["--msl-version", "20100", "--msl-decoration-binding",'),
              # o eeconst reescreve 7.0 como float hexadecimal ate dentro de __attribute__((availability(...))) dos cabecalhos do iOS;
              # o clang nao aceita isso como versao: volta para decimal
              ('    i = pathlib.Path(str(o)[:-2] + ".i")\n    i.write_text(eeconst.transform(r.stdout))',
               '    i = pathlib.Path(str(o)[:-2] + ".i")\n'
               '    import re as _re\n'
               '    def _ver(m):\n'
               '        v = ("%.3f" % float.fromhex(m.group(2))).rstrip("0")\n'
               '        return m.group(1) + "=" + (v + "0" if v.endswith(".") else v)\n'
               '    i.write_text(_re.sub(r"(introduced|deprecated|obsoleted)=(0x[0-9a-fA-F.]+p[+-]?[0-9]+)", _ver, eeconst.transform(r.stdout)))'),
              # miniaudio no iOS usa AVFoundation: o arquivo precisa ser compilado como Objective-C
              ('return [cc] + target + [a for a in cmd[1:] if a not in MAC_DROP]',
               'return [cc] + target + (["-x", "objective-c"] if IOS and any(str(a).endswith("snd_ma.c") for a in cmd) else []) + [a for a in cmd[1:] if a not in MAC_DROP]'),
              # diagnostico: o texto completo de cada erro de compilacao vai para port/build/failures.txt
              ('print("FAILED", f.name, next((l for l in e.splitlines() if "rror" in l or l.startswith("ptr32")), e.strip()[:150])[:200])',
               'print("FAILED", f.name, next((l for l in e.splitlines() if "rror" in l or l.startswith("ptr32")), e.strip()[:150])[:200]); open(ROOT / "port/build/failures.txt", "a").write("=== " + f.name + "\\n" + e[:5000] + "\\n")'),
          ])

          LINK_IOS = '''IOS_FRAMEWORKS = ["Foundation", "UIKit", "Metal", "QuartzCore", "CoreGraphics", "CoreMotion", "CoreHaptics", "AVFoundation",
                            "AVFAudio", "AudioToolbox", "CoreAudio", "CoreFoundation", "GameController", "CoreBluetooth", "CoreMedia",
                            "CoreVideo", "ImageIO", "UniformTypeIdentifiers", "OpenGLES"]

          def link_ios(objs, extra):
              """iOS arm64: one pass, SDL3 built for iOS (static), the frameworks it needs, no moved segments (the window is separate)."""
              sdl = os.environ["BT3_SDL3"]
              fw = [a for f in IOS_FRAMEWORKS for a in ("-framework", f)]
              cmd = ["clang", "-arch", "arm64", "-isysroot", mac_sdk(), "-miphoneos-version-min=14.0", "-w", "-o", str(EXE)] + extra + objs + \\
                    [f"-L{sdl}/lib", "-lSDL3", "-lc++"] + fw + ["-Wl,-no_fixup_chains", "-Wl,-e,___wrap_main", "-Wl,-export_dynamic", f"-Wl,-map,{EXE}.map"]  # (formato antigo de relocacao: o ld recente quebra com as chained fixups)
              return subprocess.run(cmd, capture_output=True, text=True)

          def link(objs, extra):
              if IOS:
                  return link_ios(objs, extra)
              if MAC:
                  return link_mac(objs, extra)'''
          edit("port/tools/link.py", [
              ('from toolchain import ROOT, VARIANT, WIN, MAC, PREFIX, OBJ, DATA, EXE, sdl3',
               'from toolchain import ROOT, VARIANT, WIN, MAC, IOS, mac_sdk, PREFIX, OBJ, DATA, EXE, sdl3'),
              ('def link(objs, extra):\n    if MAC:\n        return link_mac(objs, extra)', LINK_IOS),
          ])

          # ---- marco 2: o app de iPhone (entrada pelo SDL, janela alinhada propria, espelho do programa)
          edit("port/src/port_addr.h", [
              ('#include <mach-o/ldsyms.h> /* _mh_execute_header: the program\'s first byte */\n#define PORT_WINDOW ((uintptr_t)&_mh_execute_header - 0x20000000u)',
               '#include <TargetConditionals.h>\n#include <mach-o/ldsyms.h> /* _mh_execute_header: the program\'s first byte */\n#if TARGET_OS_IPHONE\nextern void *Port_Window; /* iOS: a window of its own, aligned (plat_ios.c) */\n#define PORT_WINDOW ((uintptr_t)Port_Window)\n#else\n#define PORT_WINDOW ((uintptr_t)&_mh_execute_header - 0x20000000u)\n#endif'),
          ])
          edit("port/src/plat_mem.c", [
              ('#include <crt_externs.h>',
               '#include <TargetConditionals.h>\n#if TARGET_OS_IPHONE\n#define PORT_MAP_FIXED MAP_FIXED /* iOS: the window is reserved by plat_ios.c; these regions replace parts of it */\n#else\n#define PORT_MAP_FIXED 0\n#endif\n#include <crt_externs.h>'),
              ('void *p = mmap((void *)at, n, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANON, -1, 0);',
               'void *p = mmap((void *)at, n, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANON | PORT_MAP_FIXED, -1, 0);'),
              ('int __wrap_main(int argc, char **argv) {\n    sArgc = argc;\n    sArgv = argv;\n    sGameStackTop = (uint8_t *)Port_Ptr(STACK_BASE + STACK_SIZE);',
               '#if TARGET_OS_IPHONE\nint Port_GameEntry(int argc, char **argv) { /* (the process\'s entry is __wrap_main in plat_ios.c) */\n#else\nint __wrap_main(int argc, char **argv) {\n#endif\n    sArgc = argc;\n    sArgv = argv;\n    sGameStackTop = (uint8_t *)Port_Ptr(STACK_BASE + STACK_SIZE);'),
              ('__attribute__((constructor)) static void Port_MapMemory(void) {',
               '#if TARGET_OS_IPHONE\nvoid Port_MapMemory(void) { /* iOS: called from the mirror (plat_ios.c), not at load */\n#else\n__attribute__((constructor)) static void Port_MapMemory(void) {\n#endif'),
          ])


          # contorno: o libclang 18 nao honra __ptr32 no arm64, e o leitor de tela tem static_assert de layout com ponteiros
          a11y = ROOT / "port/src/a11y_game.c"
          if a11y.exists():
              t = a11y.read_text()
              if "#include <stddef.h>" in t and "define _Static_assert" not in t:
                  a11y.write_text(t.replace("#include <stddef.h>", "#include <stddef.h>\n#define _Static_assert(...)", 1))
              else:
                  print("aviso: a11y_game.c sem a ancora esperada (ou ja corrigido)")

          if not ok:
              sys.exit("Algumas ancoras nao foram encontradas: o projeto deste repositorio e diferente do que eu li. Mande esta saida.")
          print("mudancas aplicadas")
          EOF
          python3 patch_ios.py
          git diff --stat || true
          BT3_CC=ios64 python3 -c "import sys; sys.path.insert(0,'port/tools'); import toolchain as t; print(t.VARIANT, t.MAC, t.IOS, t.MAC_TRIPLE, t.EXE, t.CLANG_TARGET)"

      - name: Escrever o plat_ios.c (entrada pelo SDL, janela alinhada, espelho do programa)
        run: |
          cat > port/src/plat_ios.c <<'CEOF'
          /* iOS: the process's start, SDL's UIKit application, and the game's run from a mirror of the program in a window of
             its own.

             The game's addresses are offsets in a 4 GB window whose base has its low 32 bits zero (port_addr.h, macwin.cpp).
             On macOS the program is linked at 1 TB and starts itself again with ASLR switched off, to be there. An iOS app can
             do neither (posix_spawn is refused, and the process has one free stretch of address space of about 6 GB, which
             starts on a 4 GB boundary). So the window is reserved here, aligned, and the program is MIRRORED into it at
             W + 0x20000000: its code and data are mapped a second time at that address (vm_remap, the same pages, still signed),
             and the game runs from the mirror, where every address the compiled code computes from its own position is a game
             address. The pointers the program holds in its data (rebase entries) are moved to the mirror, as a loader does.

             Everything is logged to Documents/bt3_log.txt (visible in the Files app): there is no console on the phone. */
          #include <TargetConditionals.h>
          #if TARGET_OS_IPHONE
          #include <mach-o/dyld.h>
          #include <mach-o/loader.h>
          #include <mach/mach.h>
          #include <mach/vm_map.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mman.h>
          #include <unistd.h>

          #define say(...) fprintf(stderr, __VA_ARGS__)

          /* SDL's own entry for an application (SDL_main.h): UIKit runs, and `main_fn` is called on the main thread once the
             application has launched. Declared here: the port's files are compiled without SDL's include path. */
          typedef int (*main_fn)(int argc, char **argv);
          extern int SDL_RunApp(int argc, char **argv, main_fn mainFunction, void *reserved);

          extern void *Port_Window;
          extern void Port_MapMemory(void);
          extern int Port_GameEntry(int argc, char **argv);

          typedef struct {
              uint64_t vm, size, fileoff;
              char name[17];
          } Seg;

          static Seg sSeg[16];
          static int sNSeg;
          static uint64_t sObjc[32][2]; /* sections of Objective-C metadata: left as they are (the runtime registered them where they were) */
          static int sNObjc;
          static uint64_t sOrigLo, sAlias0;
          static uint64_t sReloc, sSkipped;

          static void fail(const char *what) {
              say("bt3: %s\n", what);
              exit(3);
          }

          /* ---- log: stderr and stdout go to Documents/bt3_log.txt (the run before kept as bt3_log_prev.txt) */
          static void log_setup(void) {
              const char *home = getenv("HOME");
              char path[1024], prev[1024], data[1024];

              if (home == NULL) {
                  return;
              }
              snprintf(path, sizeof(path), "%s/Documents/bt3_log.txt", home);
              snprintf(prev, sizeof(prev), "%s/Documents/bt3_log_prev.txt", home);
              rename(path, prev);
              if (freopen(path, "w", stderr) != NULL) {
                  setvbuf(stderr, NULL, _IONBF, 0);
                  dup2(fileno(stderr), STDOUT_FILENO);
              }
              snprintf(data, sizeof(data), "%s/Documents/gamedata", home);
              setenv("BT3_DATA", data, 0);
              snprintf(data, sizeof(data), "%s/Documents", home);
              if (chdir(data) != 0) {
                  say("bt3: cannot enter %s\n", data);
              }
          }

          /* ---- the program's own load commands */
          static const struct dyld_info_command *parse_image(const struct mach_header_64 *h, intptr_t slide) {
              const struct dyld_info_command *di = NULL;
              const uint8_t *p = (const uint8_t *)(h + 1);
              uint32_t i, k;

              sNSeg = 0;
              sNObjc = 0;
              for (i = 0; i < h->ncmds; i++) {
                  const struct load_command *lc = (const struct load_command *)p;
                  if (lc->cmd == LC_SEGMENT_64 && sNSeg < 16) {
                      const struct segment_command_64 *sc = (const struct segment_command_64 *)lc;
                      const struct section_64 *sec = (const struct section_64 *)(sc + 1);
                      Seg *s = &sSeg[sNSeg++];
                      s->vm = sc->vmaddr + (uint64_t)slide;
                      s->size = sc->vmsize;
                      s->fileoff = sc->fileoff;
                      memcpy(s->name, sc->segname, 16);
                      s->name[16] = 0;
                      for (k = 0; k < sc->nsects; k++, sec++) {
                          if (strncmp(sec->sectname, "__objc", 6) == 0 && sNObjc < 32) {
                              sObjc[sNObjc][0] = sec->addr + (uint64_t)slide;
                              sObjc[sNObjc][1] = sec->addr + (uint64_t)slide + sec->size;
                              sNObjc++;
                          }
                      }
                  } else if (lc->cmd == LC_DYLD_INFO || lc->cmd == LC_DYLD_INFO_ONLY) {
                      di = (const struct dyld_info_command *)lc;
                  }
                  p += lc->cmdsize;
              }
              return di;
          }

          /* ---- the window: 4 GB aligned, in the process's one free stretch */
          static uint64_t reserve_window(void) {
              static const uint64_t gb[] = {6, 5, 4};
              unsigned i;

              for (i = 0; i < sizeof(gb) / sizeof(gb[0]); i++) {
                  vm_address_t base = 0;
                  vm_size_t total = (vm_size_t)(gb[i] << 30);
                  kern_return_t kr = vm_map(mach_task_self(), &base, total, 0, VM_FLAGS_ANYWHERE, MEMORY_OBJECT_NULL, 0, FALSE, VM_PROT_NONE,
                                            VM_PROT_READ | VM_PROT_WRITE, VM_INHERIT_DEFAULT);
                  uint64_t w;

                  if (kr != KERN_SUCCESS) {
                      say("bt3: reserving %llu GB failed (%d)\n", gb[i], (int)kr);
                      continue;
                  }
                  w = ((uint64_t)base + 0xFFFFFFFFull) & ~0xFFFFFFFFull;
                  say("bt3: reserved %llu GB at 0x%llx, window at 0x%llx, %llu MB after it\n", gb[i], (uint64_t)base, w, ((uint64_t)base + total - w) >> 20);
                  if ((uint64_t)base + total - w >= 0x80000000ull) {
                      return w;
                  }
                  vm_deallocate(mach_task_self(), base, total);
              }
              fail("no aligned window of 2 GB could be reserved");
              return 0;
          }

          /* ---- the mirror: the program's segments (not the zero page, not the link edit data) mapped again at W + 0x20000000 */
          static void mirror_segments(uint64_t w) {
              int i;

              sAlias0 = w + 0x20000000ull;
              for (i = 0; i < sNSeg; i++) {
                  vm_address_t dst;
                  vm_prot_t cur = 0, mx = 0;
                  kern_return_t kr;

                  if (strcmp(sSeg[i].name, "__PAGEZERO") == 0 || strcmp(sSeg[i].name, "__LINKEDIT") == 0) {
                      continue;
                  }
                  dst = (vm_address_t)(sAlias0 + (sSeg[i].vm - sOrigLo));
                  kr = vm_remap(mach_task_self(), &dst, (vm_size_t)sSeg[i].size, 0, VM_FLAGS_FIXED | VM_FLAGS_OVERWRITE, mach_task_self(),
                                (vm_address_t)sSeg[i].vm, FALSE, &cur, &mx, VM_INHERIT_NONE);
                  say("bt3: mirror of %s at 0x%llx: %s (kern %d, protection %d/%d)\n", sSeg[i].name, (uint64_t)dst, kr == KERN_SUCCESS ? "ok" : "FAILED", (int)kr,
                      (int)cur, (int)mx);
                  if (kr != KERN_SUCCESS) {
                      fail("the program could not be mirrored");
                  }
              }
          }

          /* ---- the program's pointers in its data: moved to the mirror (the rebase opcodes dyld applied its slide with) */
          static uint64_t uleb(const uint8_t **pp) {
              uint64_t r = 0;
              int shift = 0;
              uint8_t b;

              do {
                  b = *(*pp)++;
                  r |= (uint64_t)(b & 0x7F) << shift;
                  shift += 7;
              } while (b & 0x80);
              return r;
          }

          static void rebase_at(uint64_t addr, uint64_t delta) {
              int i;

              for (i = 0; i < sNObjc; i++) {
                  if (addr >= sObjc[i][0] && addr < sObjc[i][1]) {
                      sSkipped++;
                      return;
                  }
              }
              *(uint64_t *)(uintptr_t)addr += delta;
              sReloc++;
          }

          static void relocate(const struct dyld_info_command *di, uint64_t delta) {
              uint64_t le = 0, leOff = 0, addr = 0, n, skip;
              const uint8_t *p, *end;
              int i, type = 1;

              for (i = 0; i < sNSeg; i++) {
                  if (strcmp(sSeg[i].name, "__LINKEDIT") == 0) {
                      le = sSeg[i].vm;
                      leOff = sSeg[i].fileoff;
                  }
              }
              if (di == NULL || le == 0 || di->rebase_size == 0) {
                  fail("the program has no rebase information (it must be linked without chained fixups)");
              }
              /* the data segments are writable for this, then the constant ones are closed again */
              for (i = 0; i < sNSeg; i++) {
                  if (strncmp(sSeg[i].name, "__DATA", 6) == 0 && mprotect((void *)(uintptr_t)sSeg[i].vm, (size_t)sSeg[i].size, PROT_READ | PROT_WRITE) != 0) {
                      fail("cannot make the data segment writable");
                  }
              }
              p = (const uint8_t *)(uintptr_t)(le + (di->rebase_off - leOff));
              end = p + di->rebase_size;
              while (p < end) {
                  uint8_t op = *p++, imm = op & REBASE_IMMEDIATE_MASK;
                  op &= REBASE_OPCODE_MASK;
                  if (op == REBASE_OPCODE_DONE) {
                      break;
                  } else if (op == REBASE_OPCODE_SET_TYPE_IMM) {
                      type = imm;
                  } else if (op == REBASE_OPCODE_SET_SEGMENT_AND_OFFSET_ULEB) {
                      if (imm >= sNSeg) {
                          fail("bad segment in the rebase information");
                      }
                      addr = sSeg[imm].vm + uleb(&p);
                  } else if (op == REBASE_OPCODE_ADD_ADDR_ULEB) {
                      addr += uleb(&p);
                  } else if (op == REBASE_OPCODE_ADD_ADDR_IMM_SCALED) {
                      addr += (uint64_t)imm * 8;
                  } else if (op == REBASE_OPCODE_DO_REBASE_IMM_TIMES) {
                      for (n = 0; n < imm; n++, addr += 8) {
                          if (type == REBASE_TYPE_POINTER) rebase_at(addr, delta);
                      }
                  } else if (op == REBASE_OPCODE_DO_REBASE_ULEB_TIMES) {
                      uint64_t count = uleb(&p);
                      for (n = 0; n < count; n++, addr += 8) {
                          if (type == REBASE_TYPE_POINTER) rebase_at(addr, delta);
                      }
                  } else if (op == REBASE_OPCODE_DO_REBASE_ADD_ADDR_ULEB) {
                      if (type == REBASE_TYPE_POINTER) rebase_at(addr, delta);
                      addr += uleb(&p) + 8;
                  } else if (op == REBASE_OPCODE_DO_REBASE_ULEB_TIMES_SKIPPING_ULEB) {
                      uint64_t count = uleb(&p);
                      skip = uleb(&p);
                      for (n = 0; n < count; n++, addr += skip + 8) {
                          if (type == REBASE_TYPE_POINTER) rebase_at(addr, delta);
                      }
                  } else {
                      fail("unknown rebase opcode");
                  }
              }
              for (i = 0; i < sNSeg; i++) {
                  if (strcmp(sSeg[i].name, "__DATA_CONST") == 0) {
                      mprotect((void *)(uintptr_t)sSeg[i].vm, (size_t)sSeg[i].size, PROT_READ);
                  }
              }
              say("bt3: %llu pointers moved to the mirror, %llu in Objective-C metadata left\n", sReloc, sSkipped);
          }

          /* What runs from the mirror: the memory of the game (what the constructor did on macOS), then the game. */
          __attribute__((noinline)) static int game_via_mirror(int argc, char **argv) {
              Port_MapMemory();
              return Port_GameEntry(argc, argv);
          }

          static int app_main(int argc, char **argv) {
              const struct mach_header_64 *h = (const struct mach_header_64 *)_dyld_get_image_header(0);
              intptr_t slide = _dyld_get_image_vmaddr_slide(0);
              const struct dyld_info_command *di = parse_image(h, slide);
              uint64_t w;
              int (*fn)(int, char **);

              sOrigLo = (uint64_t)(uintptr_t)h;
              say("bt3: iOS start; the program is at 0x%llx (slide 0x%lx)\n", sOrigLo, (long)slide);
              w = reserve_window();
              mirror_segments(w);
              relocate(di, sAlias0 - sOrigLo);
              Port_Window = (void *)(uintptr_t)w;
              fn = (int (*)(int, char **))(uintptr_t)(sAlias0 + ((uint64_t)(uintptr_t)game_via_mirror - sOrigLo));
              say("bt3: entering the game through the mirror (window 0x%llx, game_via_mirror at %p)\n", w, (void *)fn);
              return fn(argc, argv);
          }

          /* The process's entry (link.py: -e ___wrap_main): dyld calls it as main. SDL runs UIKit and calls app_main on the main
             thread once the application has launched. */
          int __wrap_main(int argc, char **argv) {
              log_setup();
              say("bt3: starting\n");
              return SDL_RunApp(argc, argv, app_main, NULL);
          }
          #endif
          CEOF
          wc -l port/src/plat_ios.c

      - name: SDL3 para iOS (a partir do codigo-fonte)
        run: |
          set -o pipefail
          V=$(cat logs/sdl_version.txt)
          echo "SDL3 $V"
          git clone --depth 1 --branch "release-$V" https://github.com/libsdl-org/SDL.git sdl-src 2>&1 | tee logs/sdl_clone.txt \
            || git clone --depth 1 https://github.com/libsdl-org/SDL.git sdl-src
          cmake -S sdl-src -B sdl-build -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_BUILD_TYPE=Release -DSDL_STATIC=ON -DSDL_SHARED=OFF \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/sdl-ios" 2>&1 | tee logs/sdl_cmake.txt
          cmake --build sdl-build -j 4 2>&1 | tail -n 40 | tee logs/sdl_build.txt
          cmake --install sdl-build 2>&1 | tail -n 5
          ls sdl-ios/lib sdl-ios/include | head -20
          lipo -info sdl-ios/lib/libSDL3.a

      - name: Plugin do compilador (macwin.dylib), construido uma vez antes da compilacao em paralelo
        run: |
          set -o pipefail
          .venv/bin/python -c "import sys; sys.path.insert(0, 'port/tools'); import macwin; print(macwin.plugin())" 2>&1 | tee logs/macwin_plugin.txt
          ls -la port/build/macwin.dylib

      - name: Compilar o codigo do jogo para iOS (undefined.py)
        run: |
          set -o pipefail
          export BT3_SDL3="$PWD/sdl-ios"
          .venv/bin/python port/tools/undefined.py 2>&1 | tee logs/undefined.txt
          if grep -q "^FAILED" logs/undefined.txt; then
            echo "::error::arquivos que falharam: $(grep -c '^FAILED' logs/undefined.txt)"
            grep "^FAILED" logs/undefined.txt | cut -c1-220 | head -30
            exit 1
          fi

      - name: Ligar para iOS (link.py)
        run: |
          set -o pipefail
          export BT3_SDL3="$PWD/sdl-ios"
          .venv/bin/python port/tools/link.py 2>&1 | tee logs/link.txt
          grep -q "link OK" logs/link.txt
          ls -la port/build/bt3_ios*

      - name: Conferir que e Mach-O arm64 de iOS
        run: |
          file port/build/bt3_ios
          lipo -info port/build/bt3_ios
          otool -l port/build/bt3_ios | grep -A5 LC_BUILD_VERSION | tee logs/build_version.txt
          echo "--- stubs (simbolos que nada fornece ainda)"
          wc -l port/build/stubs.txt
          grep -c '^SDL_' port/build/stubs.txt || true
          cp port/build/stubs.txt logs/stubs.txt
          if grep -qE 'SDL_RunApp|wrap_main|Port_GameEntry|Port_MapMemory' port/build/stubs.txt; then
            echo "::error::um simbolo de entrada do iOS ficou como stub (faltou ligar):"
            grep -E 'SDL_RunApp|wrap_main|Port_GameEntry|Port_MapMemory' port/build/stubs.txt
            exit 1
          fi
          nm -g port/build/bt3_ios | grep -E "__wrap_main|SDL_RunApp|Port_GameEntry|Port_MapMemory" | tee logs/entry_symbols.txt

      - name: Empacotar o app (BT3.ipa)
        run: |
          set -e
          APP=ipa/Payload/BT3.app
          mkdir -p "$APP"
          cp port/build/bt3_ios "$APP/bt3_ios"
          if [ -f port/build/bt3_ios.dat ]; then cp port/build/bt3_ios.dat "$APP/bt3_ios.dat"; else echo "::warning::bt3_ios.dat nao foi gerado"; fi
          cat > "$APP/Info.plist" <<'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>bt3_ios</string>
          <key>CFBundleIdentifier</key><string>com.bt3ios.dragonrage</string>
          <key>CFBundleName</key><string>BT3</string>
          <key>CFBundleDisplayName</key><string>BT3</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>0.1</string>
          <key>MinimumOSVersion</key><string>14.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
          <key>UILaunchScreen</key><dict/>
          <key>UIFileSharingEnabled</key><true/>
          <key>LSSupportsOpeningDocumentsInPlace</key><true/>
          <key>UIRequiresFullScreen</key><true/>
          <key>UIStatusBarHidden</key><true/>
          <key>UIViewControllerBasedStatusBarAppearance</key><false/>
          <key>UISupportedInterfaceOrientations</key><array>
            <string>UIInterfaceOrientationLandscapeLeft</string>
            <string>UIInterfaceOrientationLandscapeRight</string>
          </array>
          </dict></plist>
          PEOF
          (cd ipa && zip -qr ../BT3.ipa Payload)
          ls -la BT3.ipa "$APP"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BT3-ipa
          path: BT3.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bt3_ios
          path: |
            port/build/bt3_ios
            port/build/bt3_ios.dat
            port/build/bt3_ios.map
          if-no-files-found: warn

      - name: Diagnostico dos erros do undefined.py (so se falhou)
        if: failure()
        run: |
          cp port/build/failures.txt logs/failures.txt 2>/dev/null || true
          echo "--- linhas do .i onde o ptr32 parou"
          for pair in plat_mem:347 file:590 btl_obj:1821 hud_b:659; do
            n=${pair%%:*}; l=${pair##*:}
            f=$(find port/build/obj_ios64 \( -name "${n}.i" -o -name "*_${n}.i" \) | head -1)
            echo "== $n ($f) linha $l"
            [ -n "$f" ] && sed -n "$((l-3)),$((l+3))p" "$f" | cut -c1-500
          done | tee logs/ptr32_linhas.txt
          echo "--- primeiros erros completos"
          head -c 6000 port/build/failures.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: logs/
