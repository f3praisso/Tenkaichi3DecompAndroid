name: ios

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Maquina do build (macos-15, ou macos-14 se a macos-15 estiver lotada)"
        default: "macos-15"
        type: choice
        options: [macos-15, macos-14]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    permissions:
      contents: write   # para publicar o BT3.ipa em Releases (download direto, sem zip)
    env:
      BT3_CC: ios64
      BT3_SKELETON: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Ferramentas (Homebrew)
        run: |
          mkdir -p logs
          brew install llvm spirv-cross shaderc cmake 2>&1 | tee logs/brew.txt
          brew info --json=v2 sdl3 | python3 -c "import json,sys; print(json.load(sys.stdin)['formulae'][0]['versions']['stable'])" | tee logs/sdl_version.txt
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Ambiente Python (libclang para o ptr32.py)
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --quiet --disable-pip-version-check "libclang==18.1.1"
          .venv/bin/python -c "import clang.cindex as c; c.Index.create(); print('libclang ok')"

      - name: Aplicar as mudancas (variante ios64 e contorno do leitor de tela)
        run: |
          cat > patch_ios.py <<'EOF'
          import pathlib, sys

          ROOT = pathlib.Path(".")
          ok = True

          def edit(path, pairs):
              global ok
              p = ROOT / path
              t = p.read_text()
              for old, new in pairs:
                  if t.count(old) != 1:
                      print(f"ANCORA NAO ENCONTRADA em {path} ({t.count(old)} vezes): {old[:90]!r}")
                      ok = False
                      continue
                  t = t.replace(old, new)
              p.write_text(t)

          edit("port/tools/toolchain.py", [
              ('MAC = VARIANT == "mac64"',
               'IOS = VARIANT == "ios64"\nMAC = VARIANT in ("mac64", "ios64")'),
              ('BITS64 = VARIANT in ("clang64", "win64", "mac64")',
               'BITS64 = VARIANT in ("clang64", "win64", "mac64", "ios64")'),
              ('MAC_TRIPLE = "arm64-apple-macos11"',
               'MAC_TRIPLE = "arm64-apple-ios14.0" if IOS else "arm64-apple-macos11"'),
              ('return subprocess.run(["xcrun", "--show-sdk-path"], capture_output=True, text=True).stdout.strip()',
               'return subprocess.run(["xcrun"] + (["--sdk", "iphoneos"] if IOS else []) + ["--show-sdk-path"], capture_output=True, text=True).stdout.strip()'),
              ('"port/build/obj_data_mac64" if MAC else',
               '"port/build/obj_data_ios64" if IOS else "port/build/obj_data_mac64" if MAC else'),
              ('"mac64": "bt3_mac"}', '"mac64": "bt3_mac", "ios64": "bt3_ios"}'),
          ])

          edit("port/tools/undefined.py", [
              ('from toolchain import VARIANT, WIN, MAC, BITS64, PREFIX, CLANG_TARGET, OBJ, DATA, sdl3, llvm',
               'from toolchain import VARIANT, WIN, MAC, IOS, MAC_TRIPLE, BITS64, PREFIX, CLANG_TARGET, OBJ, DATA, sdl3, llvm'),
              ('MAC_LLC = ["-mtriple=arm64-apple-macos11", ',
               'MAC_LLC = [f"-mtriple={MAC_TRIPLE}", '),
              ('target = CLANG_TARGET if soft else ["-arch", "arm64", "-mmacosx-version-min=11.0", f"-I{os.environ.get(\'BT3_SDL3\', \'/opt/homebrew/opt/sdl3\')}/include"]',
               'target = CLANG_TARGET if soft else (["-arch", "arm64", "-isysroot", CLANG_TARGET[-1], "-miphoneos-version-min=14.0"] if IOS else ["-arch", "arm64", "-mmacosx-version-min=11.0"]) + [f"-I{os.environ.get(\'BT3_SDL3\', \'/opt/homebrew/opt/sdl3\')}/include"]'),
              ('["spirv-cross", "--msl", "--msl-version", "20100", "--msl-decoration-binding",',
               '["spirv-cross", "--msl"] + (["--msl-ios"] if IOS else []) + ["--msl-version", "20100", "--msl-decoration-binding",'),
              # o eeconst reescreve 7.0 como float hexadecimal ate dentro de __attribute__((availability(...))) dos cabecalhos do iOS;
              # o clang nao aceita isso como versao: volta para decimal
              ('    i = pathlib.Path(str(o)[:-2] + ".i")\n    i.write_text(eeconst.transform(r.stdout))',
               '    i = pathlib.Path(str(o)[:-2] + ".i")\n'
               '    import re as _re\n'
               '    def _ver(m):\n'
               '        v = ("%.3f" % float.fromhex(m.group(2))).rstrip("0")\n'
               '        return m.group(1) + "=" + (v + "0" if v.endswith(".") else v)\n'
               '    i.write_text(_re.sub(r"(introduced|deprecated|obsoleted)=(0x[0-9a-fA-F.]+p[+-]?[0-9]+)", _ver, eeconst.transform(r.stdout)))'),
              # miniaudio no iOS usa AVFoundation: o arquivo precisa ser compilado como Objective-C
              ('return [cc] + target + [a for a in cmd[1:] if a not in MAC_DROP]',
               'return [cc] + target + (["-x", "objective-c"] + (["-fobjc-arc"] if any(str(a).endswith(("ios_touch.c", "ios_setup_ui.c")) for a in cmd) else []) if IOS and any(str(a).endswith(("snd_ma.c", "ios_touch.c", "ios_setup_ui.c")) for a in cmd) else []) + [a for a in cmd[1:] if a not in MAC_DROP]'),
              # diagnostico: o texto completo de cada erro de compilacao vai para port/build/failures.txt
              ('print("FAILED", f.name, next((l for l in e.splitlines() if "rror" in l or l.startswith("ptr32")), e.strip()[:150])[:200])',
               'print("FAILED", f.name, next((l for l in e.splitlines() if "rror" in l or l.startswith("ptr32")), e.strip()[:150])[:200]); open(ROOT / "port/build/failures.txt", "a").write("=== " + f.name + "\\n" + e[:5000] + "\\n")'),
          ])

          LINK_IOS = '''IOS_FRAMEWORKS = ["Foundation", "UIKit", "Metal", "QuartzCore", "CoreGraphics", "CoreMotion", "CoreHaptics", "AVFoundation",
                            "AVFAudio", "AudioToolbox", "CoreAudio", "CoreFoundation", "GameController", "CoreBluetooth", "CoreMedia",
                            "CoreVideo", "ImageIO", "UniformTypeIdentifiers", "OpenGLES"]

          def link_ios(objs, extra):
              """iOS arm64: one pass, SDL3 built for iOS (static), the frameworks it needs, no moved segments (the window is separate)."""
              sdl = os.environ["BT3_SDL3"]
              fw = [a for f in IOS_FRAMEWORKS for a in ("-framework", f)]
              cmd = ["clang", "-arch", "arm64", "-isysroot", mac_sdk(), "-miphoneos-version-min=14.0", "-w", "-o", str(EXE)] + extra + objs + \\
                    [f"-L{sdl}/lib", "-lSDL3", "-lc++"] + fw + ["-Wl,-no_fixup_chains", "-Wl,-e,___wrap_main", "-Wl,-export_dynamic", f"-Wl,-map,{EXE}.map"]  # (formato antigo de relocacao: o ld recente quebra com as chained fixups)
              return subprocess.run(cmd, capture_output=True, text=True)

          def link(objs, extra):
              if IOS:
                  return link_ios(objs, extra)
              if MAC:
                  return link_mac(objs, extra)'''
          edit("port/tools/link.py", [
              ('from toolchain import ROOT, VARIANT, WIN, MAC, PREFIX, OBJ, DATA, EXE, sdl3',
               'from toolchain import ROOT, VARIANT, WIN, MAC, IOS, mac_sdk, PREFIX, OBJ, DATA, EXE, sdl3'),
              ('def link(objs, extra):\n    if MAC:\n        return link_mac(objs, extra)', LINK_IOS),
          ])

          # ---- marco 2: o app de iPhone (entrada pelo SDL, janela alinhada propria, espelho do programa)
          edit("port/src/port_addr.h", [
              ('#include <mach-o/ldsyms.h> /* _mh_execute_header: the program\'s first byte */\n#define PORT_WINDOW ((uintptr_t)&_mh_execute_header - 0x20000000u)',
               '#include <TargetConditionals.h>\n#include <mach-o/ldsyms.h> /* _mh_execute_header: the program\'s first byte */\n#if TARGET_OS_IPHONE\nextern void *Port_Window; /* iOS: a window of its own, aligned (plat_ios.c) */\n#define PORT_WINDOW ((uintptr_t)Port_Window)\n#else\n#define PORT_WINDOW ((uintptr_t)&_mh_execute_header - 0x20000000u)\n#endif'),
          ])
          edit("port/src/plat_mem.c", [
              ('#include <crt_externs.h>',
               '#include <TargetConditionals.h>\n#if TARGET_OS_IPHONE\n#define PORT_MAP_FIXED MAP_FIXED /* iOS: the window is reserved by plat_ios.c; these regions replace parts of it */\n#else\n#define PORT_MAP_FIXED 0\n#endif\n#include <crt_externs.h>'),
              ('void *p = mmap((void *)at, n, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANON, -1, 0);',
               'void *p = mmap((void *)at, n, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANON | PORT_MAP_FIXED, -1, 0);'),
              ('int __wrap_main(int argc, char **argv) {\n    sArgc = argc;\n    sArgv = argv;\n    sGameStackTop = (uint8_t *)Port_Ptr(STACK_BASE + STACK_SIZE);',
               '#if TARGET_OS_IPHONE\nint Port_GameEntry(int argc, char **argv) { /* (the process\'s entry is __wrap_main in plat_ios.c) */\n#else\nint __wrap_main(int argc, char **argv) {\n#endif\n    sArgc = argc;\n    sArgv = argv;\n    sGameStackTop = (uint8_t *)Port_Ptr(STACK_BASE + STACK_SIZE);'),
              ('__attribute__((constructor)) static void Port_MapMemory(void) {',
               '#if TARGET_OS_IPHONE\nvoid Port_MapMemory(void) { /* iOS: called from the mirror (plat_ios.c), not at load */\n#else\n__attribute__((constructor)) static void Port_MapMemory(void) {\n#endif'),
          ])


          # o dispositivo SDL_GPU pedia shaders SPIR-V (Vulkan); no Apple o motor so tem MSL (SHADER_FORMAT): sem isso nao ha backend
          edit("port/src/gs/gs_gpu.c", [
              ('        SDL_SetBooleanProperty(props, SDL_PROP_GPU_DEVICE_CREATE_SHADERS_SPIRV_BOOLEAN, true);',
               '#ifdef __APPLE__\n        SDL_SetBooleanProperty(props, SDL_PROP_GPU_DEVICE_CREATE_SHADERS_MSL_BOOLEAN, true);\n#else\n        SDL_SetBooleanProperty(props, SDL_PROP_GPU_DEVICE_CREATE_SHADERS_SPIRV_BOOLEAN, true);\n#endif'),
          ])

          # salvar: o motor (plat_mc.c) responde ao jogo sem dizer nada; o log passa a dizer o que o cartao de memoria recebe e responde
          edit("port/src/plat_mc.c", [
              ('#include <dirent.h>\n', '#include <dirent.h>\n#include <errno.h>\n'),
              ('static int request(int cmd, int result) {\n    sLastCmd = cmd;',
               'static int request(int cmd, int result) {\n    static int sLogged;\n    if (sLogged < 80) { /* (the log is what says why a save did not work) */\n        sLogged++;\n        fprintf(stderr, "bt3: memory card: request %d -> %d\\n", cmd, result);\n    }\n    sLastCmd = cmd;'),
              ('    if (f == NULL) {\n        return request(2, -4);\n    }',
               '    if (f == NULL) {\n        fprintf(stderr, "bt3: memory card: cannot open %s (errno %d: %s)\\n", path, errno, strerror(errno));\n        return request(2, -4);\n    }'),
          ])
          # audio: a sessao de audio do miniaudio no iOS e "play and record" por padrao, que toma o som do aparelho; "ambient" mistura
          edit("port/src/gs/snd_ma.c", [
              ('        if (ma_engine_init(NULL, &sEngine) == MA_SUCCESS) {',
               '        ma_engine_config ec = ma_engine_config_init();\n        static ma_context sCtx;\n        ma_context_config cc = ma_context_config_init();\n        /* iOS: "ambient" mixes with what the phone is playing and follows the silent switch (the default session takes the sound over) */\n        cc.coreaudio.sessionCategory = ma_ios_session_category_ambient;\n        cc.coreaudio.sessionCategoryOptions = ma_ios_session_category_option_mix_with_others;\n        if (ma_context_init(NULL, 0, &cc, &sCtx) == MA_SUCCESS) {\n            ec.pContext = &sCtx;\n        }\n        if (ma_engine_init(&ec, &sEngine) == MA_SUCCESS) {'),
          ])

          # contorno: o libclang 18 nao honra __ptr32 no arm64, e o leitor de tela tem static_assert de layout com ponteiros
          a11y = ROOT / "port/src/a11y_game.c"
          if a11y.exists():
              t = a11y.read_text()
              if "#include <stddef.h>" in t and "define _Static_assert" not in t:
                  a11y.write_text(t.replace("#include <stddef.h>", "#include <stddef.h>\n#define _Static_assert(...)", 1))
              else:
                  print("aviso: a11y_game.c sem a ancora esperada (ou ja corrigido)")

          if not ok:
              sys.exit("Algumas ancoras nao foram encontradas: o projeto deste repositorio e diferente do que eu li. Mande esta saida.")
          print("mudancas aplicadas")
          EOF
          python3 patch_ios.py
          git diff --stat || true
          BT3_CC=ios64 python3 -c "import sys; sys.path.insert(0,'port/tools'); import toolchain as t; print(t.VARIANT, t.MAC, t.IOS, t.MAC_TRIPLE, t.EXE, t.CLANG_TARGET)"

      - name: Escrever o plat_ios.c (entrada pelo SDL, janela alinhada, espelho do programa)
        run: |
          cat > port/src/plat_ios.c <<'CEOF'
          /* iOS: the process's start, SDL's UIKit application, and the game's run from a mirror of the program in a window of
             its own.

             The game's addresses are offsets in a 4 GB window whose base has its low 32 bits zero (port_addr.h, macwin.cpp).
             On macOS the program is linked at 1 TB and starts itself again with ASLR switched off, to be there. An iOS app can
             do neither (posix_spawn is refused, and the process has one free stretch of address space of about 6 GB, which
             starts on a 4 GB boundary). So the window is reserved here, aligned, and the program is MIRRORED into it at
             W + 0x20000000: its code and data are mapped a second time at that address (vm_remap, the same pages, still signed),
             and the game runs from the mirror, where every address the compiled code computes from its own position is a game
             address. The pointers the program holds in its data (rebase entries) are moved to the mirror, as a loader does.

             Everything is logged to Documents/bt3_log.txt (visible in the Files app): there is no console on the phone. */
          #include <TargetConditionals.h>
          #if TARGET_OS_IPHONE
          #include <mach-o/dyld.h>
          #include <mach-o/loader.h>
          #include <mach/mach.h>
          #include <mach/vm_map.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <errno.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <unistd.h>

          #define say(...) fprintf(stderr, __VA_ARGS__)

          /* SDL's own entry for an application (SDL_main.h): UIKit runs, and `main_fn` is called on the main thread once the
             application has launched. Declared here: the port's files are compiled without SDL's include path. */
          typedef int (*main_fn)(int argc, char **argv);
          extern int SDL_RunApp(int argc, char **argv, main_fn mainFunction, void *reserved);

          /* port/src/gs/ios_setup.c: unpacks the user's disc image into <Documents>/gamedata, with a progress screen */
          extern int Ios_Setup(void);
          /* port/src/gs/ios_touch.c: the on-screen controller (Objective-C), put on the game's window once there is one */
          extern void Ios_TouchStart(void);

          extern void *Port_Window;
          extern void Port_MapMemory(void);
          extern int Port_GameEntry(int argc, char **argv);

          typedef struct {
              uint64_t vm, size, fileoff;
              char name[17];
          } Seg;

          static Seg sSeg[16];
          static int sNSeg;
          static uint64_t sObjc[32][2]; /* sections of Objective-C metadata: left as they are (the runtime registered them where they were) */
          static int sNObjc;
          static uint64_t sOrigLo, sAlias0;
          static uint64_t sWOrig, sImgEnd;       /* the window as the system placed it, and where the program ends */
          static uint64_t sReloc, sSkipped, sOutside;

          static void fail(const char *what) {
              say("bt3: %s\n", what);
              exit(3);
          }

          /* The engine's settings file (bt3_settings.txt, `name=number` lines, in the current directory; for a name that comes
             twice the last line counts). The iOS defaults are put there once: the first time the file has no `ios_defaults`
             line they are added to the end (which wins over a value the engine saved before it knew them), and from then on the
             player's own choices in the settings window are left alone. */
          static const char *settings_path(void) {
              const char *p = getenv("BT3_SETTINGS");
              return p != NULL && p[0] != 0 ? p : "bt3_settings.txt";
          }

          static int has_setting(const char *name) {
              char line[160];
              size_t n = strlen(name);
              int found = 0;
              FILE *f = fopen(settings_path(), "r");

              while (f != NULL && fgets(line, sizeof(line), f) != NULL) {
                  if (strncmp(line, name, n) == 0 && line[n] == '=') {
                      found = 1;
                  }
              }
              if (f != NULL) {
                  fclose(f);
              }
              return found;
          }

          static void seed_defaults(void) {
              FILE *f;

              if (has_setting("ios_defaults")) {
                  return;
              }
              if ((f = fopen(settings_path(), "a")) != NULL) {
                  fputs("\nlate_input=1\nios_defaults=1\n", f);
                  fclose(f);
              }
          }

          /* The folder of the memory card: made here, and a file written and removed in it, so the log says whether the app's
             folder takes saves at all (the game says only "cannot save"). */
          static void check_saves(void) {
              const char *root = getenv("BT3_SAVES");
              char dir[1100], test[1200];
              FILE *f;

              if (root == NULL) {
                  return;
              }
              snprintf(dir, sizeof(dir), "%s/card1", root);
              mkdir(root, 0755);
              mkdir(dir, 0755);
              snprintf(test, sizeof(test), "%s/.write_test", dir);
              if ((f = fopen(test, "wb")) != NULL) {
                  fputs("ok", f);
                  fclose(f);
                  remove(test);
                  say("bt3: saves folder %s: can be written\n", dir);
              } else {
                  say("bt3: saves folder %s: CANNOT be written (errno %d: %s)\n", dir, errno, strerror(errno));
              }
          }

          /* ---- log: stderr and stdout go to Documents/bt3_log.txt (the run before kept as bt3_log_prev.txt) */
          static void log_setup(void) {
              const char *home = getenv("HOME");
              char path[1024], prev[1024], data[1024];

              if (home == NULL) {
                  return;
              }
              snprintf(path, sizeof(path), "%s/Documents/bt3_log.txt", home);
              snprintf(prev, sizeof(prev), "%s/Documents/bt3_log_prev.txt", home);
              rename(path, prev);
              if (freopen(path, "w", stderr) != NULL) {
                  setvbuf(stderr, NULL, _IONBF, 0);
                  dup2(fileno(stderr), STDOUT_FILENO);
              }
              snprintf(data, sizeof(data), "%s/Documents/gamedata", home);
              setenv("BT3_DATA", data, 0);
              snprintf(data, sizeof(data), "%s/Documents", home);
              if (chdir(data) != 0) {
                  say("bt3: cannot enter %s\n", data);
              }
              /* "Low input lag" (F1 > Video in the engine's settings window): the wait for a picture is made just before the pads
                 are read, and one picture at most is on its way to the screen. Off in the engine; on here, where the buttons are
                 on glass: a press then waits a picture less to reach the game. Turned off in the settings window, it stays off. */
              /* where the engine keeps what is the player's, by absolute path: not the current directory's business */
              snprintf(data, sizeof(data), "%s/Documents/saves", home);
              setenv("BT3_SAVES", data, 0);
              snprintf(data, sizeof(data), "%s/Documents/bt3_settings.txt", home);
              setenv("BT3_SETTINGS", data, 0);
              /* SDL's audio session on iOS: "ambient" mixes with what the phone is already playing (music, a podcast) and
                 follows the silent switch; SDL's default, "playback", takes the sound over. (An SDL hint, read from the
                 environment too.) */
              setenv("SDL_AUDIO_CATEGORY", "ambient", 0);
              seed_defaults();
              check_saves();
          }

          /* ---- the program's own load commands */
          static const struct dyld_info_command *parse_image(const struct mach_header_64 *h, intptr_t slide) {
              const struct dyld_info_command *di = NULL;
              const uint8_t *p = (const uint8_t *)(h + 1);
              uint32_t i, k;

              sNSeg = 0;
              sNObjc = 0;
              for (i = 0; i < h->ncmds; i++) {
                  const struct load_command *lc = (const struct load_command *)p;
                  if (lc->cmd == LC_SEGMENT_64 && sNSeg < 16) {
                      const struct segment_command_64 *sc = (const struct segment_command_64 *)lc;
                      const struct section_64 *sec = (const struct section_64 *)(sc + 1);
                      Seg *s = &sSeg[sNSeg++];
                      s->vm = sc->vmaddr + (uint64_t)slide;
                      s->size = sc->vmsize;
                      s->fileoff = sc->fileoff;
                      memcpy(s->name, sc->segname, 16);
                      s->name[16] = 0;
                      for (k = 0; k < sc->nsects; k++, sec++) {
                          if (strncmp(sec->sectname, "__objc", 6) == 0 && sNObjc < 32) {
                              sObjc[sNObjc][0] = sec->addr + (uint64_t)slide;
                              sObjc[sNObjc][1] = sec->addr + (uint64_t)slide + sec->size;
                              sNObjc++;
                          }
                      }
                  } else if (lc->cmd == LC_DYLD_INFO || lc->cmd == LC_DYLD_INFO_ONLY) {
                      di = (const struct dyld_info_command *)lc;
                  }
                  p += lc->cmdsize;
              }
              return di;
          }

          /* ---- the window: 4 GB aligned, in the process's one free stretch */
          static uint64_t reserve_window(void) {
              static const uint64_t gb[] = {6, 5, 4};
              unsigned i;

              for (i = 0; i < sizeof(gb) / sizeof(gb[0]); i++) {
                  vm_address_t base = 0;
                  vm_size_t total = (vm_size_t)(gb[i] << 30);
                  kern_return_t kr = vm_map(mach_task_self(), &base, total, 0, VM_FLAGS_ANYWHERE, MEMORY_OBJECT_NULL, 0, FALSE, VM_PROT_NONE,
                                            VM_PROT_READ | VM_PROT_WRITE, VM_INHERIT_DEFAULT);
                  uint64_t w;

                  if (kr != KERN_SUCCESS) {
                      say("bt3: reserving %llu GB failed (%d)\n", gb[i], (int)kr);
                      continue;
                  }
                  w = ((uint64_t)base + 0xFFFFFFFFull) & ~0xFFFFFFFFull;
                  say("bt3: reserved %llu GB at 0x%llx, window at 0x%llx, %llu MB after it\n", gb[i], (uint64_t)base, w, ((uint64_t)base + total - w) >> 20);
                  if ((uint64_t)base + total - w >= 0x80000000ull) {
                      return w;
                  }
                  vm_deallocate(mach_task_self(), base, total);
              }
              fail("no aligned window of 2 GB could be reserved");
              return 0;
          }

          /* ---- the mirror: the program's segments (not the zero page, not the link edit data) mapped again at W + 0x20000000 */
          static void mirror_segments(uint64_t w) {
              int i;

              sAlias0 = w + 0x20000000ull;
              for (i = 0; i < sNSeg; i++) {
                  vm_address_t dst;
                  vm_prot_t cur = 0, mx = 0;
                  kern_return_t kr;

                  if (strcmp(sSeg[i].name, "__PAGEZERO") == 0 || strcmp(sSeg[i].name, "__LINKEDIT") == 0) {
                      continue;
                  }
                  dst = (vm_address_t)(sAlias0 + (sSeg[i].vm - sOrigLo));
                  kr = vm_remap(mach_task_self(), &dst, (vm_size_t)sSeg[i].size, 0, VM_FLAGS_FIXED | VM_FLAGS_OVERWRITE, mach_task_self(),
                                (vm_address_t)sSeg[i].vm, FALSE, &cur, &mx, VM_INHERIT_NONE);
                  say("bt3: mirror of %s at 0x%llx: %s (kern %d, protection %d/%d)\n", sSeg[i].name, (uint64_t)dst, kr == KERN_SUCCESS ? "ok" : "FAILED", (int)kr,
                      (int)cur, (int)mx);
                  if (kr != KERN_SUCCESS) {
                      fail("the program could not be mirrored");
                  }
              }
          }

          /* ---- the program's pointers in its data: moved to the mirror (the rebase opcodes dyld applied its slide with) */
          static uint64_t uleb(const uint8_t **pp) {
              uint64_t r = 0;
              int shift = 0;
              uint8_t b;

              do {
                  b = *(*pp)++;
                  r |= (uint64_t)(b & 0x7F) << shift;
                  shift += 7;
              } while (b & 0x80);
              return r;
          }

          /* Only a pointer into the program, or into the window below it (constants made from the window's base), is moved.
             A location the rebase information lists may hold something else by now: dyld bound the lazy symbol pointers to
             their functions after it rebased them, and the program has been running (SDL, UIKit) since. Moving those would
             break them: the first version did, and the first call of a C library function after it crashed. */
          static void rebase_at(uint64_t addr, uint64_t delta) {
              uint64_t v;
              int i;

              for (i = 0; i < sNObjc; i++) {
                  if (addr >= sObjc[i][0] && addr < sObjc[i][1]) {
                      sSkipped++;
                      return;
                  }
              }
              v = *(uint64_t *)(uintptr_t)addr;
              if (v < sWOrig || v >= sImgEnd) {
                  sOutside++;
                  return;
              }
              *(uint64_t *)(uintptr_t)addr = v + delta;
              sReloc++;
          }

          static void relocate(const struct dyld_info_command *di, uint64_t delta) {
              uint64_t le = 0, leOff = 0, addr = 0, n, skip;
              const uint8_t *p, *end;
              int i, type = 1;

              for (i = 0; i < sNSeg; i++) {
                  if (strcmp(sSeg[i].name, "__LINKEDIT") == 0) {
                      le = sSeg[i].vm;
                      leOff = sSeg[i].fileoff;
                  }
              }
              if (di == NULL || le == 0 || di->rebase_size == 0) {
                  fail("the program has no rebase information (it must be linked without chained fixups)");
              }
              sWOrig = sOrigLo - 0x20000000ull;
              sImgEnd = 0;
              for (i = 0; i < sNSeg; i++) {
                  if (strcmp(sSeg[i].name, "__PAGEZERO") != 0 && strcmp(sSeg[i].name, "__LINKEDIT") != 0 && sSeg[i].vm + sSeg[i].size > sImgEnd) {
                      sImgEnd = sSeg[i].vm + sSeg[i].size;
                  }
              }
              say("bt3: relocating: rebase information %u bytes, moving pointers in [0x%llx, 0x%llx) by 0x%llx\n", (unsigned)di->rebase_size, sWOrig, sImgEnd, delta);
              /* the data segments are writable for this, then the constant ones are closed again */
              for (i = 0; i < sNSeg; i++) {
                  if (strncmp(sSeg[i].name, "__DATA", 6) == 0 && mprotect((void *)(uintptr_t)sSeg[i].vm, (size_t)sSeg[i].size, PROT_READ | PROT_WRITE) != 0) {
                      fail("cannot make the data segment writable");
                  }
              }
              p = (const uint8_t *)(uintptr_t)(le + (di->rebase_off - leOff));
              end = p + di->rebase_size;
              while (p < end) {
                  uint8_t op = *p++, imm = op & REBASE_IMMEDIATE_MASK;
                  op &= REBASE_OPCODE_MASK;
                  if (op == REBASE_OPCODE_DONE) {
                      break;
                  } else if (op == REBASE_OPCODE_SET_TYPE_IMM) {
                      type = imm;
                  } else if (op == REBASE_OPCODE_SET_SEGMENT_AND_OFFSET_ULEB) {
                      if (imm >= sNSeg) {
                          fail("bad segment in the rebase information");
                      }
                      addr = sSeg[imm].vm + uleb(&p);
                  } else if (op == REBASE_OPCODE_ADD_ADDR_ULEB) {
                      addr += uleb(&p);
                  } else if (op == REBASE_OPCODE_ADD_ADDR_IMM_SCALED) {
                      addr += (uint64_t)imm * 8;
                  } else if (op == REBASE_OPCODE_DO_REBASE_IMM_TIMES) {
                      for (n = 0; n < imm; n++, addr += 8) {
                          if (type == REBASE_TYPE_POINTER) rebase_at(addr, delta);
                      }
                  } else if (op == REBASE_OPCODE_DO_REBASE_ULEB_TIMES) {
                      uint64_t count = uleb(&p);
                      for (n = 0; n < count; n++, addr += 8) {
                          if (type == REBASE_TYPE_POINTER) rebase_at(addr, delta);
                      }
                  } else if (op == REBASE_OPCODE_DO_REBASE_ADD_ADDR_ULEB) {
                      if (type == REBASE_TYPE_POINTER) rebase_at(addr, delta);
                      addr += uleb(&p) + 8;
                  } else if (op == REBASE_OPCODE_DO_REBASE_ULEB_TIMES_SKIPPING_ULEB) {
                      uint64_t count = uleb(&p);
                      skip = uleb(&p);
                      for (n = 0; n < count; n++, addr += skip + 8) {
                          if (type == REBASE_TYPE_POINTER) rebase_at(addr, delta);
                      }
                  } else {
                      fail("unknown rebase opcode");
                  }
              }
              for (i = 0; i < sNSeg; i++) {
                  if (strcmp(sSeg[i].name, "__DATA_CONST") == 0) {
                      mprotect((void *)(uintptr_t)sSeg[i].vm, (size_t)sSeg[i].size, PROT_READ);
                  }
              }
              say("bt3: %llu pointers moved to the mirror, %llu in Objective-C metadata left, %llu pointing elsewhere left\n", sReloc, sSkipped, sOutside);
          }

          /* What runs from the mirror: the memory of the game (what the constructor did on macOS), then the game. */
          __attribute__((noinline)) static int game_via_mirror(int argc, char **argv) {
              Ios_TouchStart();
              Port_MapMemory();
              return Port_GameEntry(argc, argv);
          }

          static int app_main(int argc, char **argv) {
              const struct mach_header_64 *h = (const struct mach_header_64 *)_dyld_get_image_header(0);
              intptr_t slide = _dyld_get_image_vmaddr_slide(0);
              const struct dyld_info_command *di = parse_image(h, slide);
              uint64_t w;
              int (*fn)(int, char **);

              sOrigLo = (uint64_t)(uintptr_t)h;
              say("bt3: iOS start; the program is at 0x%llx (slide 0x%lx)\n", sOrigLo, (long)slide);
              if (!Ios_Setup()) {
                  fail("the game's data could not be prepared");
              }
              w = reserve_window();
              mirror_segments(w);
              relocate(di, sAlias0 - sOrigLo);
              Port_Window = (void *)(uintptr_t)w;
              fn = (int (*)(int, char **))(uintptr_t)(sAlias0 + ((uint64_t)(uintptr_t)game_via_mirror - sOrigLo));
              say("bt3: entering the game through the mirror (window 0x%llx, game_via_mirror at %p)\n", w, (void *)fn);
              return fn(argc, argv);
          }

          /* The process's entry (link.py: -e ___wrap_main): dyld calls it as main. SDL runs UIKit and calls app_main on the main
             thread once the application has launched. */
          int __wrap_main(int argc, char **argv) {
              log_setup();
              say("bt3: starting\n");
              return SDL_RunApp(argc, argv, app_main, NULL);
          }
          #endif
          CEOF
          wc -l port/src/plat_ios.c

      - name: Escrever o ios_setup.c (disco do jogo para gamedata, com tela de progresso)
        run: |
          cat > port/src/gs/ios_setup.c <<'SEOF'
          /* iOS: the game's data from the user's own disc image (the part that has no screen: ios_setup_ui.c has it).

             The engine reads the unpacked disc from <Documents>/gamedata (what port/tools/extract_disc.py makes on a PC, and what
             the Android launcher makes): disc/SLUS_216.78, disc/BIN/..., the other files of DATA under disc/DATA/, and every AFS
             archive of DATA split into gamedata/<name>/00000.bin, 00001.bin... one file per entry.

             There is no PC here: this reads the .iso (ISO 9660, 2048-byte sectors) the user pointed to and writes that layout.
             It runs on a thread of its own, and tells its progress through an IosProgress the screen reads. Nothing from the disc
             is kept anywhere but the app's own folder. */
          #include <dirent.h>
          #include <errno.h>
          #include <libgen.h>
          #include <mach-o/dyld.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <strings.h>
          #include <sys/mount.h>
          #include <sys/stat.h>
          #include <unistd.h>

          #include "ios_setup.h"

          #define SECTOR 2048u
          #define say(...) fprintf(stderr, __VA_ARGS__)

          typedef struct {
              uint32_t lba, size;
              int dir;
              char name[256];
          } Ent;

          typedef struct {
              int afs;          /* split into gamedata/<stem>/ instead of copied */
              uint32_t lba, size;
              char path[512];   /* destination file, or the folder for an archive */
          } Task;

          static FILE *sIso;
          static IosProgress *sP;

          static void progress(const char *label) {
              snprintf(sP->what, sizeof(sP->what), "%s", label);
          }

          /* ---------------------------------------------------------------------------------------------------- files */
          static uint32_t rd32(const uint8_t *p) {
              return (uint32_t)p[0] | (uint32_t)p[1] << 8 | (uint32_t)p[2] << 16 | (uint32_t)p[3] << 24;
          }

          static int read_at(uint64_t off, void *buf, size_t n) {
              return fseeko(sIso, (off_t)off, SEEK_SET) == 0 && fread(buf, 1, n, sIso) == n;
          }

          static void mkdirs(const char *path) {
              char tmp[1024];
              char *p;

              snprintf(tmp, sizeof(tmp), "%s", path);
              for (p = tmp + 1; *p; p++) {
                  if (*p == '/') {
                      *p = 0;
                      mkdir(tmp, 0755);
                      *p = '/';
                  }
              }
              mkdir(tmp, 0755);
          }

          /* bytes [off, off+size) of the disc -> a file (a new file each time) */
          static int copy_out(uint64_t off, uint64_t size, const char *dst, const char *label) {
              static uint8_t buf[1 << 20];
              FILE *f = fopen(dst, "wb");
              uint64_t done = 0;

              if (f == NULL) {
                  snprintf(sP->fail, sizeof(sP->fail), "Não consegui criar %s (%s).", dst, strerror(errno));
                  return 0;
              }
              while (done < size) {
                  size_t n = size - done < sizeof(buf) ? (size_t)(size - done) : sizeof(buf);
                  if (!read_at(off + done, buf, n) || fwrite(buf, 1, n, f) != n) {
                      snprintf(sP->fail, sizeof(sP->fail), "Erro ao ler o disco ou gravar %s (%s). Falta espaço?", dst, strerror(errno));
                      fclose(f);
                      return 0;
                  }
                  done += n;
                  sP->done += n;
                  progress(label);
              }
              return fclose(f) == 0;
          }

          /* ---------------------------------------------------------------------------------------------------- ISO 9660 */
          static Ent *list_dir(uint32_t lba, uint32_t size, int *count) {
              uint8_t *buf = malloc(size);
              Ent *v = NULL;
              uint32_t off = 0;
              int n = 0, cap = 0;

              *count = 0;
              if (buf == NULL || !read_at((uint64_t)lba * SECTOR, buf, size)) {
                  free(buf);
                  return NULL;
              }
              while (off < size) {
                  const uint8_t *r = buf + off;
                  unsigned len = r[0], nl;
                  if (len == 0) { /* records do not cross a sector: the rest of this one is padding */
                      off = (off / SECTOR + 1) * SECTOR;
                      continue;
                  }
                  if (off + len > size) {
                      break;
                  }
                  nl = r[32];
                  if (!(nl == 1 && (r[33] == 0 || r[33] == 1))) {
                      Ent *e;
                      if (n == cap) {
                          cap = cap ? cap * 2 : 64;
                          v = realloc(v, (size_t)cap * sizeof(Ent));
                      }
                      e = &v[n++];
                      e->lba = rd32(r + 2);
                      e->size = rd32(r + 10);
                      e->dir = (r[25] & 2) != 0;
                      memcpy(e->name, r + 33, nl);
                      e->name[nl] = 0;
                      {   /* "NAME.EXT;1" -> "NAME.EXT" ; "NAME." -> "NAME" */
                          char *semi = strchr(e->name, ';');
                          if (semi) *semi = 0;
                          nl = (unsigned)strlen(e->name);
                          if (nl > 0 && e->name[nl - 1] == '.') e->name[nl - 1] = 0;
                      }
                  }
                  off += len;
              }
              free(buf);
              *count = n;
              return v;
          }

          static const Ent *find(const Ent *v, int n, const char *name) {
              int i;
              for (i = 0; i < n; i++) {
                  if (strcasecmp(v[i].name, name) == 0) {
                      return &v[i];
                  }
              }
              return NULL;
          }

          static Task *sTasks;
          static int sNTasks, sCapTasks;

          static Task *task_new(void) {
              if (sNTasks == sCapTasks) {
                  sCapTasks = sCapTasks ? sCapTasks * 2 : 64;
                  sTasks = realloc(sTasks, (size_t)sCapTasks * sizeof(Task));
              }
              memset(&sTasks[sNTasks], 0, sizeof(Task));
              return &sTasks[sNTasks++];
          }

          /* everything under a folder of the disc: files copied to <dst>/<name>, folders followed; in DATA, archives split */
          static void plan_dir(const Ent *dir, const char *dst, const char *gamedata, int splitAfs) {
              int n = 0, i;
              Ent *v = list_dir(dir->lba, dir->size, &n);

              for (i = 0; i < n; i++) {
                  Task *t;
                  if (v[i].dir) {
                      char sub[512];
                      snprintf(sub, sizeof(sub), "%s/%s", dst, v[i].name);
                      mkdirs(sub);
                      plan_dir(&v[i], sub, gamedata, 0);
                      continue;
                  }
                  t = task_new();
                  t->lba = v[i].lba;
                  t->size = v[i].size;
                  if (splitAfs && strlen(v[i].name) > 4 && strcasecmp(v[i].name + strlen(v[i].name) - 4, ".AFS") == 0) {
                      char stem[256];
                      size_t k;
                      snprintf(stem, sizeof(stem), "%s", v[i].name);
                      stem[strlen(stem) - 4] = 0;
                      for (k = 0; stem[k]; k++) {
                          if (stem[k] >= 'A' && stem[k] <= 'Z') stem[k] = (char)(stem[k] + 32);
                      }
                      t->afs = 1;
                      snprintf(t->path, sizeof(t->path), "%s/%s", gamedata, stem);
                  } else {
                      snprintf(t->path, sizeof(t->path), "%s/%s", dst, v[i].name);
                  }
                  sP->total += v[i].size;
              }
              free(v);
          }

          static int split_afs(const Task *t) {
              uint8_t head[8];
              uint8_t *table;
              uint32_t count, i;
              uint64_t base = (uint64_t)t->lba * SECTOR;

              if (!read_at(base, head, 8) || memcmp(head, "AFS\0", 4) != 0) {
                  snprintf(sP->fail, sizeof(sP->fail), "%s não é um arquivo AFS válido.", t->path);
                  return 0;
              }
              count = rd32(head + 4);
              if (count == 0 || count > 200000) {
                  snprintf(sP->fail, sizeof(sP->fail), "Um arquivo AFS do disco tem %u entradas (estranho).", count);
                  return 0;
              }
              table = malloc((size_t)count * 8);
              if (table == NULL || !read_at(base + 8, table, (size_t)count * 8)) {
                  free(table);
                  snprintf(sP->fail, sizeof(sP->fail), "Não consegui ler a tabela de %s.", t->path);
                  return 0;
              }
              mkdirs(t->path);
              for (i = 0; i < count; i++) {
                  uint32_t eoff = rd32(table + i * 8), esize = rd32(table + i * 8 + 4);
                  char dst[640];
                  if ((uint64_t)eoff + esize > (uint64_t)t->size) {
                      snprintf(sP->fail, sizeof(sP->fail), "A entrada %u de %s está fora do arquivo.", i, t->path);
                      free(table);
                      return 0;
                  }
                  snprintf(dst, sizeof(dst), "%s/%05u.bin", t->path, i);
                  if (!copy_out(base + eoff, esize, dst, strrchr(t->path, '/') + 1)) {
                      free(table);
                      return 0;
                  }
              }
              free(table);
              return 1;
          }

          /* ---------------------------------------------------------------------------------------------------- the whole job */
          static int extract(const char *isoPath, const char *gamedata);

          /* Runs to the end (on the caller's thread) and tells how it went in `p`. */
          int IosData_Extract(const char *isoPath, const char *gamedata, IosProgress *p) {
              int ok;

              sP = p;
              p->done = p->total = 0;
              p->what[0] = 0;
              p->fail[0] = 0;
              p->ok = 0;
              p->finished = 0;
              ok = extract(isoPath, gamedata);
              if (ok) {
                  char ready[700];
                  FILE *f;
                  snprintf(ready, sizeof(ready), "%s/.bt3_ready", gamedata);
                  if ((f = fopen(ready, "w")) != NULL) {
                      fputs("ok\n", f);
                      fclose(f);
                  }
                  say("bt3: the game's data are ready (%s can be deleted now)\n", isoPath);
              } else {
                  say("bt3: unpacking failed: %s\n", p->fail);
              }
              if (ok) {
                  p->done = p->total;
              }
              p->ok = ok;
              p->finished = 1;
              return ok;
          }

          static int extract(const char *isoPath, const char *gamedata) {
              uint8_t pvd[SECTOR];
              int n = 0, i;
              Ent *root;
              const Ent *slus, *bin, *data;
              char disc[512], p[640];
              struct statfs fs;

              sIso = fopen(isoPath, "rb");
              if (sIso == NULL) {
                  snprintf(sP->fail, sizeof(sP->fail), "Não consegui abrir %s.", isoPath);
                  return 0;
              }
              if (!read_at(16 * (uint64_t)SECTOR, pvd, SECTOR) || pvd[0] != 1 || memcmp(pvd + 1, "CD001", 5) != 0) {
                  snprintf(sP->fail, sizeof(sP->fail), "Isso não é uma imagem ISO 9660 de 2048 bytes por setor.");
                  fclose(sIso);
                  return 0;
              }
              root = list_dir(rd32(pvd + 156 + 2), rd32(pvd + 156 + 10), &n);
              if (root == NULL || (slus = find(root, n, "SLUS_216.78")) == NULL || (bin = find(root, n, "BIN")) == NULL ||
                  (data = find(root, n, "DATA")) == NULL) {
                  snprintf(sP->fail, sizeof(sP->fail), "Este disco não é o do jogo (USA, SLUS-21678): faltam SLUS_216.78, BIN ou DATA.");
                  free(root);
                  fclose(sIso);
                  return 0;
              }
              snprintf(disc, sizeof(disc), "%s/disc", gamedata);
              mkdirs(disc);
              snprintf(p, sizeof(p), "%s/DATA", disc);
              mkdirs(p);
              snprintf(p, sizeof(p), "%s/BIN", disc);
              mkdirs(p);

              sNTasks = 0;
              sP->done = sP->total = 0;
              {   /* SLUS_216.78 */
                  Task *t = task_new();
                  t->lba = slus->lba;
                  t->size = slus->size;
                  snprintf(t->path, sizeof(t->path), "%s/SLUS_216.78", disc);
                  sP->total += slus->size;
              }
              snprintf(p, sizeof(p), "%s/BIN", disc);
              plan_dir(bin, p, gamedata, 0);
              snprintf(p, sizeof(p), "%s/DATA", disc);
              plan_dir(data, p, gamedata, 1);
              free(root);

              if (statfs(gamedata, &fs) == 0 && (uint64_t)fs.f_bavail * fs.f_bsize < sP->total + (200ull << 20)) {
                  snprintf(sP->fail, sizeof(sP->fail), "Falta espaço: preciso de %llu MB livres e há %llu MB.", (unsigned long long)((sP->total >> 20) + 200),
                           (unsigned long long)(((uint64_t)fs.f_bavail * fs.f_bsize) >> 20));
                  fclose(sIso);
                  return 0;
              }
              say("bt3: unpacking %s: %d files, %llu MB\n", isoPath, sNTasks, (unsigned long long)(sP->total >> 20));
              for (i = 0; i < sNTasks; i++) {
                  const Task *t = &sTasks[i];
                  int ok = t->afs ? split_afs(t) : copy_out((uint64_t)t->lba * SECTOR, t->size, t->path, strrchr(t->path, '/') + 1);
                  if (!ok) {
                      fclose(sIso);
                      return 0;
                  }
              }
              fclose(sIso);
              return 1;
          }

          static int exists(const char *path) {
              struct stat st;
              return stat(path, &st) == 0;
          }

          /* The first .iso in the folder, whose size has stopped changing (the Files app may still be copying it). */
          int IosData_FindIso(const char *dir, char *out, size_t cap) {
              DIR *d = opendir(dir);
              struct dirent *e;
              int found = 0;

              if (d == NULL) {
                  return 0;
              }
              while (!found && (e = readdir(d)) != NULL) {
                  size_t n = strlen(e->d_name);
                  if (n > 4 && strcasecmp(e->d_name + n - 4, ".iso") == 0) {
                      snprintf(out, cap, "%s/%s", dir, e->d_name);
                      found = 1;
                  }
              }
              closedir(d);
              return found;
          }

          /* The engine's menu wording (port/translations in the source tree) comes inside the app; the engine reads it from
             <gamedata>/game-text/translations. Copied when it is not there yet (a file already there is left alone). */
          static void copy_tree(const char *src, const char *dst) {
              DIR *d = opendir(src);
              struct dirent *e;

              if (d == NULL) {
                  return;
              }
              mkdirs(dst);
              while ((e = readdir(d)) != NULL) {
                  char s[1100], t[1100];
                  struct stat st;
                  if (strcmp(e->d_name, ".") == 0 || strcmp(e->d_name, "..") == 0) {
                      continue;
                  }
                  snprintf(s, sizeof(s), "%s/%s", src, e->d_name);
                  snprintf(t, sizeof(t), "%s/%s", dst, e->d_name);
                  if (stat(s, &st) != 0) {
                      continue;
                  }
                  if (S_ISDIR(st.st_mode)) {
                      copy_tree(s, t);
                  } else if (!exists(t)) {
                      FILE *in = fopen(s, "rb"), *out = in ? fopen(t, "wb") : NULL;
                      char buf[8192];
                      size_t n;
                      while (out != NULL && (n = fread(buf, 1, sizeof(buf), in)) > 0) {
                          fwrite(buf, 1, n, out);
                      }
                      if (out) fclose(out);
                      if (in) fclose(in);
                  }
              }
              closedir(d);
          }

          void IosData_Translations(const char *gamedata) {
              char exe[1024], src[1100], dst[1100];
              uint32_t n = sizeof(exe);

              if (_NSGetExecutablePath(exe, &n) != 0) {
                  return;
              }
              snprintf(src, sizeof(src), "%s/translations", dirname(exe));
              snprintf(dst, sizeof(dst), "%s/game-text/translations", gamedata);
              copy_tree(src, dst);
          }

          /* 1: the data are unpacked (the marker is written when the last file is) and the program of the game is there. */
          int IosData_Ready(const char *gamedata) {
              char ready[700], slus[700];

              snprintf(ready, sizeof(ready), "%s/.bt3_ready", gamedata);
              snprintf(slus, sizeof(slus), "%s/disc/SLUS_216.78", gamedata);
              return exists(ready) && exists(slus);
          }
          SEOF
          cat > port/src/gs/ios_setup.h <<'HEOF'
          /* ios_setup.c (the disc to gamedata) and ios_setup_ui.c (its screen) */
          #ifndef IOS_SETUP_H
          #define IOS_SETUP_H
          #include <stddef.h>
          #include <stdint.h>

          /* what the screen reads while the work goes on (written by the worker thread, read by the main thread) */
          typedef struct {
              volatile uint64_t done, total;
              volatile int finished, ok;
              char what[96];  /* the file being written */
              char fail[512]; /* why it did not work (valid when finished && !ok) */
          } IosProgress;

          int IosData_Ready(const char *gamedata);
          int IosData_FindIso(const char *dir, char *out, size_t cap);
          int IosData_Extract(const char *isoPath, const char *gamedata, IosProgress *p);
          void IosData_Translations(const char *gamedata);
          #endif
          HEOF
          wc -l port/src/gs/ios_setup.c port/src/gs/ios_setup.h

      - name: Escrever o ios_setup_ui.c (a tela da preparacao dos dados, em UIKit)
        run: |
          cat > port/src/gs/ios_setup_ui.c <<'UEOF'
          /* iOS: the screen of the preparation of the game's data (the work itself is ios_setup.c).

             Objective-C in a .c file: the build compiles this one as Objective-C with ARC (undefined.py). It runs before the game's
             code, in the program as the system loaded it, on a window of its own that goes away when the data are ready.
             The disc image is chosen with the Files app's picker (read where it is: no copy of 4 GB) or put by hand in the app's
             folder in the Files app (the first .iso there, once its size has stopped changing, starts the work by itself). The
             work runs on a thread of its own, and this screen shows its progress. */
          #import <UIKit/UIKit.h>
          #import <UniformTypeIdentifiers/UniformTypeIdentifiers.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/stat.h>

          #include "ios_setup.h"

          #define ORANGE [UIColor colorWithRed:1.0 green:0.63 blue:0.12 alpha:1.0]

          @interface BT3Setup : UIViewController <UIDocumentPickerDelegate>
          @property (nonatomic, copy) NSString *docs;
          @property (nonatomic, copy) NSString *gamedata;
          @property (nonatomic, readonly) BOOL finished;
          - (void)tick;
          @end

          @implementation BT3Setup {
              UILabel *_title, *_body, *_percent, *_status;
              UIProgressView *_bar;
              UIButton *_pick, *_retry;
              IosProgress _prog;
              BOOL _working, _finished, _failed;
              NSURL *_scoped;
              NSString *_failedPath, *_isoPath;
              uint64_t _lastSize;
              int _stable;
              CFTimeInterval _lastPoll;
          }

          - (BOOL)finished {
              return _finished;
          }

          - (UILabel *)label:(NSString *)text size:(CGFloat)size bold:(BOOL)bold color:(UIColor *)color {
              UILabel *l = [[UILabel alloc] init];
              l.text = text;
              l.font = bold ? [UIFont boldSystemFontOfSize:size] : [UIFont systemFontOfSize:size];
              l.textColor = color;
              l.textAlignment = NSTextAlignmentCenter;
              l.numberOfLines = 0;
              return l;
          }

          - (UIButton *)button:(NSString *)title action:(SEL)action {
              UIButton *b = [UIButton buttonWithType:UIButtonTypeSystem];
              [b setTitle:title forState:UIControlStateNormal];
              b.titleLabel.font = [UIFont boldSystemFontOfSize:17];
              [b setTitleColor:UIColor.blackColor forState:UIControlStateNormal];
              b.backgroundColor = ORANGE;
              b.layer.cornerRadius = 12;
              [b.heightAnchor constraintEqualToConstant:46].active = YES;
              [b addTarget:self action:action forControlEvents:UIControlEventTouchUpInside];
              return b;
          }

          - (void)viewDidLoad {
              UIStackView *st;

              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.05 green:0.06 blue:0.14 alpha:1.0];
              _title = [self label:@"Preparar os dados do jogo" size:25 bold:YES color:ORANGE];
              _body = [self label:@"" size:15 bold:NO color:[UIColor colorWithWhite:0.92 alpha:1.0]];
              _bar = [[UIProgressView alloc] initWithProgressViewStyle:UIProgressViewStyleDefault];
              _bar.progressTintColor = ORANGE;
              _bar.trackTintColor = [UIColor colorWithWhite:1.0 alpha:0.18];
              _percent = [self label:@"" size:17 bold:YES color:UIColor.whiteColor];
              _status = [self label:@"" size:12 bold:NO color:[UIColor colorWithWhite:0.7 alpha:1.0]];
              _pick = [self button:@"Escolher o arquivo .iso…" action:@selector(pickTapped)];
              _retry = [self button:@"Procurar de novo" action:@selector(retryTapped)];
              st = [[UIStackView alloc] initWithArrangedSubviews:@[_title, _body, _bar, _percent, _status, _pick, _retry]];
              st.axis = UILayoutConstraintAxisVertical;
              st.spacing = 12;
              st.alignment = UIStackViewAlignmentFill;
              st.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:st];
              [NSLayoutConstraint activateConstraints:@[
                  [st.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [st.centerYAnchor constraintEqualToAnchor:self.view.centerYAnchor],
                  [st.widthAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.widthAnchor multiplier:0.72],
              ]];
              [self showWaiting];
          }

          /* ---- the states of the screen */
          - (void)showWaiting {
              _title.text = @"Preparar os dados do jogo";
              _body.text = @"O jogo precisa do arquivo .iso do seu disco (Dragon Ball Z Budokai Tenkaichi 3, versão USA). Toque no botão para escolher o arquivo. "
                            @"Ou copie o .iso para a pasta BT3, no app Arquivos: aqui ele começa sozinho.";
              _body.textColor = [UIColor colorWithWhite:0.92 alpha:1.0];
              _bar.hidden = _percent.hidden = _status.hidden = _retry.hidden = YES;
              _pick.hidden = NO;
          }

          - (void)showWorking {
              _title.text = @"Preparando…";
              _body.text = @"Lendo o disco e gravando os arquivos do jogo. Isso leva alguns minutos e só acontece uma vez. Mantenha o app aberto.";
              _body.textColor = [UIColor colorWithWhite:0.92 alpha:1.0];
              _bar.progress = 0;
              _percent.text = @"0%";
              _status.text = @"";
              _bar.hidden = _percent.hidden = _status.hidden = NO;
              _pick.hidden = _retry.hidden = YES;
          }

          - (void)showFailure:(NSString *)why {
              _title.text = @"Não deu certo";
              _body.text = why;
              _body.textColor = [UIColor colorWithRed:1.0 green:0.55 blue:0.5 alpha:1.0];
              _bar.hidden = _percent.hidden = _status.hidden = YES;
              _pick.hidden = _retry.hidden = NO;
          }

          /* ---- the work */
          - (void)startWithPath:(NSString *)path scoped:(NSURL *)url {
              NSString *iso = [path copy], *gd = [self.gamedata copy];
              IosProgress *p = &_prog;

              _working = YES;
              _failed = NO;
              _isoPath = iso;
              _scoped = url;
              UIApplication.sharedApplication.idleTimerDisabled = YES;
              [self showWorking];
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  IosData_Extract(iso.fileSystemRepresentation, gd.fileSystemRepresentation, p);
              });
          }

          - (void)pickTapped {
              UIDocumentPickerViewController *pk = [[UIDocumentPickerViewController alloc] initForOpeningContentTypes:@[UTTypeData] asCopy:NO];
              pk.delegate = self;
              pk.allowsMultipleSelection = NO;
              [self presentViewController:pk animated:YES completion:nil];
          }

          - (void)documentPicker:(UIDocumentPickerViewController *)controller didPickDocumentsAtURLs:(NSArray<NSURL *> *)urls {
              NSURL *u = urls.firstObject;
              if (u != nil && !_working) {
                  BOOL access = [u startAccessingSecurityScopedResource];
                  [self startWithPath:u.path scoped:access ? u : nil];
              }
          }

          - (void)retryTapped {
              _failedPath = nil;
              _failed = NO;
              _stable = 0;
              _lastSize = 0;
              [self showWaiting];
          }

          /* called about twenty times a second by the loop that serves the window */
          - (void)tick {
              if (_working) {
                  uint64_t d = _prog.done, t = _prog.total;
                  char what[96];

                  memcpy(what, _prog.what, sizeof(what));
                  what[sizeof(what) - 1] = 0;
                  if (t > 0) {
                      _bar.progress = (float)((double)d / (double)t);
                      _percent.text = [NSString stringWithFormat:@"%d%%  ·  %llu de %llu MB", (int)(d * 100 / t), (unsigned long long)(d >> 20), (unsigned long long)(t >> 20)];
                  }
                  _status.text = [NSString stringWithUTF8String:what] ?: @"";
                  if (_prog.finished) {
                      _working = NO;
                      UIApplication.sharedApplication.idleTimerDisabled = NO;
                      if (_scoped != nil) {
                          [_scoped stopAccessingSecurityScopedResource];
                          _scoped = nil;
                      }
                      if (_prog.ok) {
                          IosData_Translations(self.gamedata.fileSystemRepresentation);
                          _finished = YES;
                      } else {
                          _failed = YES;
                          _failedPath = _isoPath;
                          [self showFailure:[NSString stringWithUTF8String:_prog.fail] ?: @"Erro desconhecido."];
                      }
                  }
                  return;
              }
              if (_failed || self.presentedViewController != nil || CACurrentMediaTime() - _lastPoll < 1.0) {
                  return;
              }
              _lastPoll = CACurrentMediaTime();
              {   /* an .iso put in the app's folder: started once its size has stopped changing (the Files app may still be copying) */
                  char path[1024];
                  struct stat st;
                  if (IosData_FindIso(self.docs.fileSystemRepresentation, path, sizeof(path)) && stat(path, &st) == 0 && ![_failedPath isEqualToString:@(path)]) {
                      if ((uint64_t)st.st_size == _lastSize) {
                          _stable++;
                      } else {
                          _stable = 0;
                          _lastSize = (uint64_t)st.st_size;
                      }
                      _body.text = [NSString stringWithFormat:@"Disco encontrado: %s (%llu MB).\n%@", strrchr(path, '/') + 1, (unsigned long long)(_lastSize >> 20),
                                                              _stable >= 2 ? @"Começando…" : @"Esperando a cópia terminar…"];
                      if (_stable >= 2) {
                          [self startWithPath:@(path) scoped:nil];
                      }
                  } else {
                      _stable = 0;
                      _lastSize = 0;
                  }
              }
          }
          @end

          static UIWindowScene *first_scene(void) {
              for (UIScene *sc in UIApplication.sharedApplication.connectedScenes) {
                  if ([sc isKindOfClass:UIWindowScene.class]) {
                      return (UIWindowScene *)sc;
                  }
              }
              return nil;
          }

          /* 1 when the data are there (the screen has come and gone if they were not); 0 if there is nowhere to put them. */
          int Ios_Setup(void) {
              const char *home = getenv("HOME");
              char docs[512], gamedata[600];

              if (home == NULL) {
                  return 0;
              }
              snprintf(docs, sizeof(docs), "%s/Documents", home);
              snprintf(gamedata, sizeof(gamedata), "%s/gamedata", docs);
              if (IosData_Ready(gamedata)) {
                  IosData_Translations(gamedata);
                  return 1;
              }
              @autoreleasepool {
                  BT3Setup *vc = [[BT3Setup alloc] init];
                  UIWindowScene *scene = first_scene();
                  UIWindow *win = scene != nil ? [[UIWindow alloc] initWithWindowScene:scene] : [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];

                  vc.docs = @(docs);
                  vc.gamedata = @(gamedata);
                  win.rootViewController = vc;
                  [win makeKeyAndVisible];
                  while (!vc.finished) {
                      [[NSRunLoop currentRunLoop] runMode:NSDefaultRunLoopMode beforeDate:[NSDate dateWithTimeIntervalSinceNow:0.05]];
                      [vc tick];
                  }
                  win.hidden = YES;
                  win.rootViewController = nil;
              }
              return 1;
          }
          UEOF
          wc -l port/src/gs/ios_setup_ui.c

      - name: Escrever o ios_touch.c (controle na tela, Objective-C)
        run: |
          cat > port/src/gs/ios_touch.c <<'TEOF'
          /* iOS: the on-screen controller. (The engine takes it through Port_TouchPad, port/src/gs/gs_input.c: player 1's buttons
             and sticks, added to the keyboard's and the controllers'. Android draws it in Kotlin: TouchPadView.)

             Objective-C in a .c file: the build compiles this one as Objective-C with ARC (undefined.py). A transparent view over
             the game's window: the left stick (fixed or floating) or the D-pad, the PlayStation buttons, L1/L2/R1/R2, SELECT and
             START, TROCA (L3: swaps the fighter) and PRÓX. (a short push of the right stick down: the next target).
             Top centre: a gear (menu: size, opacity, floating stick, edit the positions, reset) and an eye (hide/show).
             A touch outside every control goes on to the game's window. START and SELECT together open the engine's settings. */
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <Metal/Metal.h>
          #include <stdio.h>

          extern void Port_TouchPad(unsigned buttons, int lx, int ly, int rx, int ry);
          extern int gPortOverlayOpen; /* gs_input.c: the engine's settings window is open */
          extern int Port_Setting(const char *name, int def);  /* plat_settings.c: bt3_settings.txt */
          extern int Port_LateInput(void);                     /* plat_stub.c: "Low input lag" */

          enum {
              B_SELECT = 0x0001, B_L3 = 0x0002, B_START = 0x0008, B_UP = 0x0010, B_RIGHT = 0x0020, B_DOWN = 0x0040, B_LEFT = 0x0080,
              B_L2 = 0x0100, B_R2 = 0x0200, B_L1 = 0x0400, B_R1 = 0x0800,
              B_TRIANGLE = 0x1000, B_CIRCLE = 0x2000, B_CROSS = 0x4000, B_SQUARE = 0x8000
          };

          /* the movable pieces; each key and the stick belong to one */
          enum { E_DPAD, E_FACE, E_STICK, E_L1, E_L2, E_R1, E_R2, E_SELECT, E_START, E_TROCA, E_PROX, E_MODE, E_COUNT };
          enum { K_BUTTON, K_PULSE, K_MODE };

          typedef struct {
              unsigned bit;
              int kind, elem;
              float ox, oy, w, h; /* in units of u, from the piece's centre */
              const char *label;
          } Key;

          static const Key kKeys[] = {
              {B_UP, K_BUTTON, E_DPAD, 0, -1, 1, 1, "▲"},       {B_DOWN, K_BUTTON, E_DPAD, 0, 1, 1, 1, "▼"},
              {B_LEFT, K_BUTTON, E_DPAD, -1, 0, 1, 1, "◀"},     {B_RIGHT, K_BUTTON, E_DPAD, 1, 0, 1, 1, "▶"},
              {B_TRIANGLE, K_BUTTON, E_FACE, 0, -1, 1, 1, "△"}, {B_CROSS, K_BUTTON, E_FACE, 0, 1, 1, 1, "✕"},
              {B_SQUARE, K_BUTTON, E_FACE, -1, 0, 1, 1, "□"},   {B_CIRCLE, K_BUTTON, E_FACE, 1, 0, 1, 1, "○"},
              {B_L1, K_BUTTON, E_L1, 0, 0, 1.5f, 0.8f, "L1"},   {B_L2, K_BUTTON, E_L2, 0, 0, 1.5f, 0.8f, "L2"},
              {B_R1, K_BUTTON, E_R1, 0, 0, 1.5f, 0.8f, "R1"},   {B_R2, K_BUTTON, E_R2, 0, 0, 1.5f, 0.8f, "R2"},
              {B_SELECT, K_BUTTON, E_SELECT, 0, 0, 1.5f, 0.7f, "SELECT"}, {B_START, K_BUTTON, E_START, 0, 0, 1.5f, 0.7f, "START"},
              {B_L3, K_BUTTON, E_TROCA, 0, 0, 1.4f, 0.7f, "TROCA"},       {0, K_PULSE, E_PROX, 0, 0, 1.4f, 0.7f, "PRÓX."},
              {0, K_MODE, E_MODE, 0, 0, 1.6f, 0.6f, "MODO"},
          };
          #define N_KEYS ((int)(sizeof(kKeys) / sizeof(kKeys[0])))

          @interface BT3Pad : UIView
          - (void)releaseAll;
          @end

          @implementation BT3Pad {
              /* settings (saved) */
              float _scale, _alpha;
              BOOL _floating, _hidden, _dpadMode, _editing;
              CGPoint _custom[E_COUNT]; /* where the user put a piece: as fractions of the view (valid when _isCustom) */
              BOOL _isCustom[E_COUNT];
              /* geometry */
              CGFloat _u, _m;
              CGPoint _ctr[E_COUNT];
              CGRect _rect[N_KEYS], _gear, _eye, _done;
              /* layers */
              CAShapeLayer *_shape[N_KEYS];
              CATextLayer *_text[N_KEYS];
              CAShapeLayer *_stickBase, *_stickThumb, *_gearShape, *_eyeShape, *_doneShape, *_veil;
              CATextLayer *_gearText, *_eyeText, *_doneText, *_banner;
              /* state */
              BOOL _menuUp; /* the gear's menu is on the screen */
              BOOL _down[N_KEYS];
              BOOL _shown[N_KEYS]; /* what the layers show of _down */
              BOOL _stickShown;
              __weak UITouch *_stickTouch;
              __weak UITouch *_dragTouch;
              __weak UITouch *_gearTouch;
              __weak UITouch *_eyeTouch;
              __weak UITouch *_doneTouch;
              CGPoint _stickCtr, _stickPos, _dragOff;
              int _dragElem;
              CFTimeInterval _pulseUntil;
              unsigned _bits;
              int _lx, _ly;
          }

          /* ---------------------------------------------------------------------------------------------- settings */
          - (void)loadSettings {
              NSUserDefaults *d = NSUserDefaults.standardUserDefaults;
              NSArray *pos = [d arrayForKey:@"bt3pad.pos"];
              int e;

              _scale = [d objectForKey:@"bt3pad.scale"] ? [d floatForKey:@"bt3pad.scale"] : 1.0f;
              _alpha = [d objectForKey:@"bt3pad.alpha"] ? [d floatForKey:@"bt3pad.alpha"] : 0.8f;
              _floating = [d boolForKey:@"bt3pad.floating"];
              _hidden = [d boolForKey:@"bt3pad.hidden"];
              _dpadMode = [d boolForKey:@"bt3pad.dpad"];
              for (e = 0; e < E_COUNT; e++) {
                  _isCustom[e] = NO;
                  if (pos.count == (NSUInteger)E_COUNT * 2) {
                      float x = [pos[e * 2] floatValue], y = [pos[e * 2 + 1] floatValue];
                      if (x >= 0 && y >= 0) {
                          _custom[e] = CGPointMake(x, y);
                          _isCustom[e] = YES;
                      }
                  }
              }
          }

          - (void)saveSettings {
              NSUserDefaults *d = NSUserDefaults.standardUserDefaults;
              NSMutableArray *pos = [NSMutableArray array];
              int e;

              for (e = 0; e < E_COUNT; e++) {
                  [pos addObject:@(_isCustom[e] ? _custom[e].x : -1.0f)];
                  [pos addObject:@(_isCustom[e] ? _custom[e].y : -1.0f)];
              }
              [d setObject:pos forKey:@"bt3pad.pos"];
              [d setFloat:_scale forKey:@"bt3pad.scale"];
              [d setFloat:_alpha forKey:@"bt3pad.alpha"];
              [d setBool:_floating forKey:@"bt3pad.floating"];
              [d setBool:_hidden forKey:@"bt3pad.hidden"];
              [d setBool:_dpadMode forKey:@"bt3pad.dpad"];
          }

          /* ---------------------------------------------------------------------------------------------- layers */
          - (CAShapeLayer *)newShape {
              CAShapeLayer *s = [CAShapeLayer layer];
              s.strokeColor = [UIColor colorWithWhite:1.0 alpha:0.7].CGColor;
              s.lineWidth = 2.0;
              s.fillColor = [UIColor colorWithWhite:1.0 alpha:0.08].CGColor;
              [self.layer addSublayer:s];
              return s;
          }

          - (CATextLayer *)newText {
              CATextLayer *t = [CATextLayer layer];
              t.alignmentMode = kCAAlignmentCenter;
              t.foregroundColor = [UIColor colorWithWhite:1.0 alpha:0.9].CGColor;
              t.contentsScale = UIScreen.mainScreen.scale;
              [self.layer addSublayer:t];
              return t;
          }

          - (instancetype)initWithFrame:(CGRect)frame {
              int i;

              self = [super initWithFrame:frame];
              if (self == nil) {
                  return nil;
              }
              self.multipleTouchEnabled = YES;
              self.backgroundColor = UIColor.clearColor;
              self.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self loadSettings];
              _lx = _ly = 0x80;
              _veil = [self newShape];
              _veil.fillColor = [UIColor colorWithWhite:0.0 alpha:0.55].CGColor;
              _veil.strokeColor = nil;
              _veil.hidden = YES;
              _stickBase = [self newShape];
              _stickThumb = [self newShape];
              for (i = 0; i < N_KEYS; i++) {
                  _shape[i] = [self newShape];
                  _text[i] = [self newText];
                  _text[i].string = [NSString stringWithUTF8String:kKeys[i].label];
              }
              _gearShape = [self newShape];
              _gearText = [self newText];
              _gearText.string = @"⚙";
              _eyeShape = [self newShape];
              _eyeText = [self newText];
              _eyeText.string = @"◉";
              _doneShape = [self newShape];
              _doneText = [self newText];
              _doneText.string = @"PRONTO";
              _banner = [self newText];
              _banner.string = @"Arraste os controles para onde quiser. Toque em PRONTO para terminar.";
              _banner.wrapped = YES;
              return self;
          }

          /* ---------------------------------------------------------------------------------------------- geometry */
          - (CGPoint)defaultCenter:(int)e {
              CGFloat w = self.bounds.size.width, h = self.bounds.size.height;
              UIEdgeInsets si = self.safeAreaInsets;
              CGFloat L = MAX(si.left, 0) + _m, R = w - MAX(si.right, 0) - _m, T = _m, B = h - MAX(si.bottom, 0) - _m;
              CGFloat u = _u;

              switch (e) {
              case E_DPAD:
              case E_STICK: return CGPointMake(L + 1.8 * u, B - 1.8 * u);
              case E_FACE: return CGPointMake(R - 1.8 * u, B - 1.8 * u);
              case E_L1: return CGPointMake(L + 0.8 * u, T + 0.45 * u);
              case E_L2: return CGPointMake(L + 0.8 * u, T + 1.4 * u);
              case E_R1: return CGPointMake(R - 0.8 * u, T + 0.45 * u);
              case E_R2: return CGPointMake(R - 0.8 * u, T + 1.4 * u);
              case E_SELECT: return CGPointMake(w / 2 - 1.0 * u, B - 0.4 * u);
              case E_START: return CGPointMake(w / 2 + 1.0 * u, B - 0.4 * u);
              case E_TROCA: return CGPointMake(L + 0.8 * u, T + 2.35 * u);
              case E_PROX: return CGPointMake(R - 0.8 * u, T + 2.35 * u);
              case E_MODE: return CGPointMake(L + 1.8 * u, B - 4.0 * u);
              }
              return CGPointZero;
          }

          - (BOOL)keyVisible:(int)k {
              return kKeys[k].elem != E_DPAD || _dpadMode;
          }

          - (CGFloat)stickRadius {
              return 1.35 * _u;
          }

          - (void)computeGeometry {
              CGFloat w = self.bounds.size.width, h = self.bounds.size.height;
              int e, k;

              _u = MIN(w, h) * 0.165 * _scale;
              _m = MIN(w, h) * 0.05;
              for (e = 0; e < E_COUNT; e++) {
                  _ctr[e] = _isCustom[e] ? CGPointMake(_custom[e].x * w, _custom[e].y * h) : [self defaultCenter:e];
              }
              for (k = 0; k < N_KEYS; k++) {
                  const Key *K = &kKeys[k];
                  _rect[k] = CGRectMake(_ctr[K->elem].x + (K->ox - K->w / 2) * _u, _ctr[K->elem].y + (K->oy - K->h / 2) * _u, K->w * _u, K->h * _u);
              }
              {
                  CGFloat gs = MAX(MIN(w, h) * 0.11, 34);
                  _gear = CGRectMake(w / 2 - gs - 4, 6, gs, gs);
                  _eye = CGRectMake(w / 2 + 4, 6, gs, gs);
                  _done = CGRectMake(w / 2 - 1.3 * _u, h / 2 - 0.45 * _u, 2.6 * _u, 0.9 * _u);
              }
          }

          - (BOOL)stickVisible {
              return !_dpadMode && (!_hidden || _editing);
          }

          - (void)refresh {
              CGFloat w = self.bounds.size.width, h = self.bounds.size.height;
              BOOL show = !_hidden || _editing;
              CGFloat Rs = [self stickRadius];
              int k;

              [self computeGeometry];
              [CATransaction begin];
              [CATransaction setDisableActions:YES];
              _veil.hidden = !_editing;
              _veil.path = [UIBezierPath bezierPathWithRect:self.bounds].CGPath;
              for (k = 0; k < N_KEYS; k++) {
                  const Key *K = &kKeys[k];
                  BOOL vis = show && [self keyVisible:k];
                  BOOL isRound = K->elem == E_DPAD || K->elem == E_FACE;
                  CGRect r = _rect[k];
                  CGFloat fs = K->elem == E_DPAD || K->elem == E_FACE ? _u * 0.42 : (K->w > 1.45 ? _u * 0.27 : _u * 0.24);

                  _shape[k].hidden = !vis;
                  _text[k].hidden = !vis;
                  _shape[k].opacity = _alpha;
                  _text[k].opacity = _alpha;
                  _shape[k].path = [UIBezierPath bezierPathWithRoundedRect:r cornerRadius:isRound ? r.size.width / 2 : 10].CGPath;
                  _shape[k].fillColor = [UIColor colorWithWhite:1.0 alpha:_down[k] ? 0.4 : 0.08].CGColor;
                  _shown[k] = _down[k];
                  _text[k].fontSize = fs;
                  _text[k].frame = CGRectMake(r.origin.x, r.origin.y + (r.size.height - fs * 1.25) / 2, r.size.width, fs * 1.3);
                  if (K->kind == K_MODE) {
                      _text[k].string = _dpadMode ? @"D-PAD" : @"ANALÓG.";
                  }
              }
              {   /* the stick: its ring where it was put down (floating) or where it lives, and the thumb */
                  BOOL active = _stickTouch != nil;
                  CGPoint c = active ? _stickCtr : _ctr[E_STICK];
                  CGFloat dx = active ? _stickPos.x - c.x : 0, dy = active ? _stickPos.y - c.y : 0, mag = hypot(dx, dy);

                  if (mag > Rs) {
                      dx *= Rs / mag;
                      dy *= Rs / mag;
                  }
                  _stickBase.hidden = _stickThumb.hidden = ![self stickVisible];
                  _stickBase.opacity = _stickThumb.opacity = _floating && !active && !_editing ? _alpha * 0.45 : _alpha;
                  _stickBase.path = [UIBezierPath bezierPathWithOvalInRect:CGRectMake(c.x - Rs, c.y - Rs, 2 * Rs, 2 * Rs)].CGPath;
                  _stickThumb.path = [UIBezierPath bezierPathWithOvalInRect:CGRectMake(c.x + dx - Rs * 0.5, c.y + dy - Rs * 0.5, Rs, Rs)].CGPath;
                  _stickThumb.fillColor = [UIColor colorWithWhite:1.0 alpha:active ? 0.35 : 0.15].CGColor;
                  _stickShown = active;
              }
              /* gear and eye: always there, a little fainter */
              _gearShape.path = [UIBezierPath bezierPathWithRoundedRect:_gear cornerRadius:_gear.size.width / 2].CGPath;
              _eyeShape.path = [UIBezierPath bezierPathWithRoundedRect:_eye cornerRadius:_eye.size.width / 2].CGPath;
              _gearShape.opacity = _eyeShape.opacity = 0.7;
              _gearText.fontSize = _eyeText.fontSize = _gear.size.width * 0.6;
              _gearText.frame = CGRectMake(_gear.origin.x, _gear.origin.y + _gear.size.height * 0.12, _gear.size.width, _gear.size.height);
              _eyeText.frame = CGRectMake(_eye.origin.x, _eye.origin.y + _eye.size.height * 0.12, _eye.size.width, _eye.size.height);
              _gearText.opacity = _eyeText.opacity = 0.9;
              _eyeShape.fillColor = [UIColor colorWithWhite:1.0 alpha:_hidden ? 0.4 : 0.08].CGColor;
              /* editing */
              _doneShape.hidden = _doneText.hidden = _banner.hidden = !_editing;
              _doneShape.path = [UIBezierPath bezierPathWithRoundedRect:_done cornerRadius:12].CGPath;
              _doneShape.fillColor = [UIColor colorWithRed:0.9 green:0.5 blue:0.1 alpha:0.9].CGColor;
              _doneText.fontSize = _u * 0.34;
              _doneText.frame = CGRectMake(_done.origin.x, _done.origin.y + (_done.size.height - _u * 0.45) / 2, _done.size.width, _u * 0.5);
              _banner.fontSize = _u * 0.3;
              _banner.frame = CGRectMake(w * 0.2, h / 2 - 1.4 * _u, w * 0.6, _u * 0.9);
              [CATransaction commit];
          }

          /* What a touch changes, and nothing else: the pressed keys' fill and the stick's ring and thumb. (A full refresh makes
             every path again: on the game's own thread, every touch event, that is time taken from the frame.) */
          - (void)refreshState {
              BOOL active = _stickTouch != nil;
              int k;

              [CATransaction begin];
              [CATransaction setDisableActions:YES];
              for (k = 0; k < N_KEYS; k++) {
                  if (_down[k] != _shown[k]) {
                      _shown[k] = _down[k];
                      _shape[k].fillColor = [UIColor colorWithWhite:1.0 alpha:_down[k] ? 0.4 : 0.08].CGColor;
                  }
              }
              if (active || _stickShown) {
                  CGFloat Rs = [self stickRadius];
                  CGPoint c = active ? _stickCtr : _ctr[E_STICK];
                  CGFloat dx = active ? _stickPos.x - c.x : 0, dy = active ? _stickPos.y - c.y : 0, mag = hypot(dx, dy);

                  if (mag > Rs) {
                      dx *= Rs / mag;
                      dy *= Rs / mag;
                  }
                  _stickBase.opacity = _stickThumb.opacity = _floating && !active && !_editing ? _alpha * 0.45 : _alpha;
                  _stickBase.path = [UIBezierPath bezierPathWithOvalInRect:CGRectMake(c.x - Rs, c.y - Rs, 2 * Rs, 2 * Rs)].CGPath;
                  _stickThumb.path = [UIBezierPath bezierPathWithOvalInRect:CGRectMake(c.x + dx - Rs * 0.5, c.y + dy - Rs * 0.5, Rs, Rs)].CGPath;
                  _stickThumb.fillColor = [UIColor colorWithWhite:1.0 alpha:active ? 0.35 : 0.15].CGColor;
                  _stickShown = active;
              }
              [CATransaction commit];
          }

          - (void)layoutSubviews {
              [super layoutSubviews];
              [self refresh];
          }

          /* ---------------------------------------------------------------------------------------------- what is where */
          - (BOOL)startsStick:(CGPoint)p {
              CGFloat w = self.bounds.size.width, h = self.bounds.size.height;

              if (_dpadMode) {
                  return NO;
              }
              if (_floating) {
                  return p.x < w * 0.45 && p.y > h * 0.3;
              }
              return hypot(p.x - _ctr[E_STICK].x, p.y - _ctr[E_STICK].y) < [self stickRadius] * 1.5;
          }

          - (int)keyAt:(CGPoint)p {
              int k;
              for (k = 0; k < N_KEYS; k++) {
                  if ([self keyVisible:k] && CGRectContainsPoint(CGRectInset(_rect[k], -6, -6), p)) {
                      return k;
                  }
              }
              return -1;
          }

          /* the piece under a point, for moving it */
          - (int)elementAt:(CGPoint)p {
              int k = [self keyAt:p];

              if (k >= 0) {
                  return kKeys[k].elem;
              }
              if (!_dpadMode && hypot(p.x - _ctr[E_STICK].x, p.y - _ctr[E_STICK].y) < [self stickRadius] * 1.2) {
                  return E_STICK;
              }
              return -1;
          }

          /* only a touch on a control is ours; the rest goes on to the game's window */
          - (UIView *)hitTest:(CGPoint)p withEvent:(UIEvent *)e {
              if (_editing || CGRectContainsPoint(_gear, p) || CGRectContainsPoint(_eye, p)) {
                  return self;
              }
              if (!_hidden && ([self keyAt:p] >= 0 || [self startsStick:p])) {
                  return self;
              }
              return nil;
          }

          /* ---------------------------------------------------------------------------------------------- output */
          - (void)publish {
              Port_TouchPad(_bits, _lx, _ly, 0x80, CACurrentMediaTime() < _pulseUntil ? 0xFF : 0x80);
          }

          - (void)releaseAll {
              int k;
              _stickTouch = nil;
              _dragTouch = nil;
              for (k = 0; k < N_KEYS; k++) {
                  _down[k] = NO;
              }
              _bits = 0;
              _lx = _ly = 0x80;
              [self publish];
              [self refresh];
          }

          - (void)update:(UIEvent *)event {
              BOOL now[N_KEYS] = {0};
              BOOL modeChanged = NO;
              unsigned bits = 0;
              int k, lx = 0x80, ly = 0x80;

              if (!_hidden && !_editing) {
                  for (UITouch *t in event.allTouches) {
                      if (t.phase == UITouchPhaseEnded || t.phase == UITouchPhaseCancelled || t == _stickTouch || t == _gearTouch || t == _eyeTouch) {
                          continue;
                      }
                      CGPoint p = [t locationInView:self];
                      for (k = 0; k < N_KEYS; k++) {
                          if ([self keyVisible:k] && CGRectContainsPoint(CGRectInset(_rect[k], -6, -6), p)) {
                              now[k] = YES;
                          }
                      }
                  }
                  if (_stickTouch != nil) {
                      CGFloat Rs = [self stickRadius], dx = _stickPos.x - _stickCtr.x, dy = _stickPos.y - _stickCtr.y, mag = hypot(dx, dy);
                      if (mag > Rs) {
                          dx *= Rs / mag;
                          dy *= Rs / mag;
                      }
                      lx = (int)lroundf((float)(128 + dx / Rs * 127));
                      ly = (int)lroundf((float)(128 + dy / Rs * 127));
                  }
              }
              for (k = 0; k < N_KEYS; k++) {
                  if (now[k] && !_down[k]) { /* just pressed */
                      if (kKeys[k].kind == K_PULSE) {
                          _pulseUntil = CACurrentMediaTime() + 0.12;
                          dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.14 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{ [self publish]; });
                      } else if (kKeys[k].kind == K_MODE) {
                          _dpadMode = !_dpadMode;
                          _stickTouch = nil;
                          [self saveSettings];
                          modeChanged = YES;
                      }
                  }
                  if (now[k] && kKeys[k].kind == K_BUTTON) {
                      bits |= kKeys[k].bit;
                  }
                  _down[k] = now[k];
              }
              _bits = bits;
              _lx = MAX(0, MIN(255, lx));
              _ly = MAX(0, MIN(255, ly));
              [self publish];
              if (modeChanged) {
                  [self refresh];
              } else {
                  [self refreshState];
              }
          }

          /* ---------------------------------------------------------------------------------------------- touches */
          /* How long a press waited before this view saw it (the touch's own time against now): it waits for the game's thread to
             take the events. Logged every ten seconds, "touch: N presses, ...", to see where a delay is. */
          static void note_delivery(UITouch *t) {
              static double sum, max, since;
              static int n;
              double now = CACurrentMediaTime(), lag = (now - t.timestamp) * 1000.0;

              sum += lag;
              n++;
              if (lag > max) {
                  max = lag;
              }
              if (since == 0) {
                  since = now;
              }
              if (now - since > 10.0) {
                  fprintf(stderr, "bt3: touch: %d presses in %.0f s, seen %.1f ms after the touch on average (worst %.1f ms)\n", n, now - since, sum / n, max);
                  sum = max = 0;
                  n = 0;
                  since = now;
              }
          }

          - (void)touchesBegan:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
              for (UITouch *t in touches) {
                  CGPoint p = [t locationInView:self];
                  note_delivery(t);
                  if (CGRectContainsPoint(_gear, p)) {
                      _gearTouch = t;
                  } else if (CGRectContainsPoint(_eye, p)) {
                      _eyeTouch = t;
                  } else if (_editing) {
                      if (CGRectContainsPoint(_done, p)) {
                          _doneTouch = t;
                      } else if (_dragTouch == nil) {
                          int e = [self elementAt:p];
                          if (e >= 0) {
                              _dragTouch = t;
                              _dragElem = e;
                              _dragOff = CGPointMake(p.x - _ctr[e].x, p.y - _ctr[e].y);
                          }
                      }
                  } else if (!_hidden && _stickTouch == nil && [self keyAt:p] < 0 && [self startsStick:p]) {
                      _stickTouch = t;
                      _stickCtr = _floating ? p : _ctr[E_STICK];
                      _stickPos = p;
                  }
              }
              [self update:event];
          }

          - (void)touchesMoved:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
              for (UITouch *t in touches) {
                  CGPoint p = [t locationInView:self];
                  if (t == _stickTouch) {
                      _stickPos = p;
                  } else if (t == _dragTouch) {
                      CGFloat w = self.bounds.size.width, h = self.bounds.size.height;
                      CGFloat x = MAX(0, MIN(w, p.x - _dragOff.x)), y = MAX(0, MIN(h, p.y - _dragOff.y));
                      _custom[_dragElem] = CGPointMake(x / w, y / h);
                      _isCustom[_dragElem] = YES;
                  }
              }
              [self update:event];
          }

          - (void)finish:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event cancelled:(BOOL)cancelled {
              for (UITouch *t in touches) {
                  CGPoint p = [t locationInView:self];
                  if (t == _stickTouch) {
                      _stickTouch = nil;
                  } else if (t == _dragTouch) {
                      _dragTouch = nil;
                      [self saveSettings];
                  } else if (t == _gearTouch) {
                      _gearTouch = nil;
                      if (!cancelled && CGRectContainsPoint(_gear, p)) {
                          [self showMenu];
                      }
                  } else if (t == _eyeTouch) {
                      _eyeTouch = nil;
                      if (!cancelled && CGRectContainsPoint(_eye, p)) {
                          _hidden = !_hidden;
                          [self saveSettings];
                          [self releaseAll];
                      }
                  } else if (t == _doneTouch) {
                      _doneTouch = nil;
                      if (!cancelled && CGRectContainsPoint(_done, p)) {
                          _editing = NO;
                          [self saveSettings];
                          [self releaseAll];
                      }
                  }
              }
              [self update:event];
          }

          - (void)touchesEnded:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event { [self finish:touches withEvent:event cancelled:NO]; }
          - (void)touchesCancelled:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event { [self finish:touches withEvent:event cancelled:YES]; }

          /* ---------------------------------------------------------------------------------------------- the gear's menu */
          /* an action of the menu: it says the menu is gone, then does its work */
          - (UIAlertAction *)act:(NSString *)title style:(UIAlertActionStyle)style do:(void (^)(void))work {
              return [UIAlertAction actionWithTitle:title style:style handler:^(UIAlertAction *a) {
                  self->_menuUp = NO;
                  if (work != nil) {
                      work();
                  }
              }];
          }

          - (void)showMenu {
              UIViewController *vc = self.window.rootViewController;
              UIAlertController *ac;
              UIAlertActionStyle normal = UIAlertActionStyleDefault;

              if (_menuUp || vc == nil || vc.presentedViewController != nil) { /* one menu at a time */
                  return;
              }
              [self releaseAll];
              ac = [UIAlertController alertControllerWithTitle:@"Controles na tela"
                                                       message:[NSString stringWithFormat:@"Tamanho %d%%   Opacidade %d%%", (int)lroundf(_scale * 100), (int)lroundf(_alpha * 100)]
                                                preferredStyle:UIAlertControllerStyleAlert];
              [ac addAction:[self act:@"Editar posições" style:normal do:^{
                  self->_editing = YES;
                  self->_hidden = NO;
                  [self refresh];
              }]];
              [ac addAction:[self act:@"Botões maiores" style:normal do:^{
                  self->_scale = MIN(1.8f, self->_scale + 0.1f);
                  [self saveSettings];
                  [self refresh];
              }]];
              [ac addAction:[self act:@"Botões menores" style:normal do:^{
                  self->_scale = MAX(0.5f, self->_scale - 0.1f);
                  [self saveSettings];
                  [self refresh];
              }]];
              [ac addAction:[self act:@"Mais opacos" style:normal do:^{
                  self->_alpha = MIN(1.0f, self->_alpha + 0.1f);
                  [self saveSettings];
                  [self refresh];
              }]];
              [ac addAction:[self act:@"Mais transparentes" style:normal do:^{
                  self->_alpha = MAX(0.2f, self->_alpha - 0.1f);
                  [self saveSettings];
                  [self refresh];
              }]];
              [ac addAction:[self act:_floating ? @"Analógico fixo" : @"Analógico flutuante" style:normal do:^{
                  self->_floating = !self->_floating;
                  [self saveSettings];
                  [self refresh];
              }]];
              [ac addAction:[self act:@"Restaurar o padrão" style:UIAlertActionStyleDestructive do:^{
                  int e;
                  for (e = 0; e < E_COUNT; e++) {
                      self->_isCustom[e] = NO;
                  }
                  self->_scale = 1.0f;
                  self->_alpha = 0.8f;
                  self->_floating = NO;
                  self->_dpadMode = NO;
                  [self saveSettings];
                  [self refresh];
              }]];
              [ac addAction:[self act:@"Fechar" style:UIAlertActionStyleCancel do:nil]];
              _menuUp = YES;
              [vc presentViewController:ac animated:YES completion:nil];
          }
          @end

          static BT3Pad *sPad;

          static UIWindow *game_window(void) {
              UIWindow *win = nil;
              for (UIScene *sc in UIApplication.sharedApplication.connectedScenes) {
                  if ([sc isKindOfClass:UIWindowScene.class]) {
                      for (UIWindow *w in ((UIWindowScene *)sc).windows) {
                          if (w.isKeyWindow || win == nil) {
                              win = w;
                          }
                      }
                  }
              }
              return win;
          }

          /* The game's picture reaches the screen through a CAMetalLayer that lets up to three pictures wait for the display's
             refresh (its default): up to two refreshes of delay between a press and what it does, on top of the game's own.
             Two is the layer's least. `ios_drawables` in bt3_settings.txt (2 or 3) puts it back if the game stutters. */
          static void tune_metal(UIWindow *win) {
              NSMutableArray<CALayer *> *todo = [NSMutableArray arrayWithObject:win.layer];
              int want = Port_Setting("ios_drawables", 2);

              want = want < 2 ? 2 : want > 3 ? 3 : want;
              while (todo.count > 0) {
                  CALayer *l = todo.lastObject;
                  [todo removeLastObject];
                  if ([l isKindOfClass:CAMetalLayer.class]) {
                      CAMetalLayer *m = (CAMetalLayer *)l;
                      if ((int)m.maximumDrawableCount != want) {
                          fprintf(stderr, "bt3: Metal layer: %d pictures may wait for the display (was %d)\n", want, (int)m.maximumDrawableCount);
                          m.maximumDrawableCount = (NSUInteger)want;
                      }
                  }
                  if (l.sublayers != nil) {
                      [todo addObjectsFromArray:l.sublayers];
                  }
              }
          }

          /* Called by plat_ios.c when the game starts: the game's window comes a little later, so a timer puts the controller on
             it as soon as there is one, keeps it on top, and hides it while the engine's settings window is open. */
          void Ios_TouchStart(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  [NSTimer scheduledTimerWithTimeInterval:0.4 repeats:YES block:^(NSTimer *timer) {
                      UIWindow *win = game_window();
                      BOOL overlay, modal;
                      if (win == nil) {
                          return;
                      }
                      if (sPad == nil) {
                          sPad = [[BT3Pad alloc] initWithFrame:win.bounds];
                          fprintf(stderr, "bt3: low input lag: %s\n", Port_LateInput() ? "on" : "off");
                      }
                      tune_metal(win);
                      modal = win.rootViewController.presentedViewController != nil; /* the gear's menu, the Files picker... */
                      if (sPad.superview != win) {
                          [win addSubview:sPad];
                          sPad.frame = win.bounds;
                      } else if (!modal) {
                          [win bringSubviewToFront:sPad]; /* (not above a menu: its buttons would go on being touched) */
                      }
                      overlay = gPortOverlayOpen != 0 || modal;
                      if (overlay && !sPad.hidden) {
                          [sPad releaseAll];
                      }
                      sPad.hidden = overlay;
                  }];
              });
          }
          TEOF
          wc -l port/src/gs/ios_touch.c

      - name: SDL3 para iOS (a partir do codigo-fonte)
        run: |
          set -o pipefail
          V=$(cat logs/sdl_version.txt)
          echo "SDL3 $V"
          git clone --depth 1 --branch "release-$V" https://github.com/libsdl-org/SDL.git sdl-src 2>&1 | tee logs/sdl_clone.txt \
            || git clone --depth 1 https://github.com/libsdl-org/SDL.git sdl-src
          cmake -S sdl-src -B sdl-build -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_BUILD_TYPE=Release -DSDL_STATIC=ON -DSDL_SHARED=OFF \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/sdl-ios" 2>&1 | tee logs/sdl_cmake.txt
          cmake --build sdl-build -j 4 2>&1 | tail -n 40 | tee logs/sdl_build.txt
          cmake --install sdl-build 2>&1 | tail -n 5
          ls sdl-ios/lib sdl-ios/include | head -20
          lipo -info sdl-ios/lib/libSDL3.a

      - name: Plugin do compilador (macwin.dylib), construido uma vez antes da compilacao em paralelo
        run: |
          set -o pipefail
          .venv/bin/python -c "import sys; sys.path.insert(0, 'port/tools'); import macwin; print(macwin.plugin())" 2>&1 | tee logs/macwin_plugin.txt
          ls -la port/build/macwin.dylib

      - name: Compilar o codigo do jogo para iOS (undefined.py)
        run: |
          set -o pipefail
          export BT3_SDL3="$PWD/sdl-ios"
          .venv/bin/python port/tools/undefined.py 2>&1 | tee logs/undefined.txt
          if grep -q "^FAILED" logs/undefined.txt; then
            echo "::error::arquivos que falharam: $(grep -c '^FAILED' logs/undefined.txt)"
            grep "^FAILED" logs/undefined.txt | cut -c1-220 | head -30
            exit 1
          fi

      - name: Ligar para iOS (link.py)
        run: |
          set -o pipefail
          export BT3_SDL3="$PWD/sdl-ios"
          .venv/bin/python port/tools/link.py 2>&1 | tee logs/link.txt
          grep -q "link OK" logs/link.txt
          ls -la port/build/bt3_ios*

      - name: Conferir que e Mach-O arm64 de iOS
        run: |
          file port/build/bt3_ios
          lipo -info port/build/bt3_ios
          otool -l port/build/bt3_ios | grep -A5 LC_BUILD_VERSION | tee logs/build_version.txt
          echo "--- stubs (simbolos que nada fornece ainda)"
          wc -l port/build/stubs.txt
          grep -c '^SDL_' port/build/stubs.txt || true
          cp port/build/stubs.txt logs/stubs.txt
          if grep -qE 'SDL_RunApp|wrap_main|Port_GameEntry|Port_MapMemory' port/build/stubs.txt; then
            echo "::error::um simbolo de entrada do iOS ficou como stub (faltou ligar):"
            grep -E 'SDL_RunApp|wrap_main|Port_GameEntry|Port_MapMemory' port/build/stubs.txt
            exit 1
          fi
          nm -g port/build/bt3_ios | grep -E "__wrap_main|SDL_RunApp|Port_GameEntry|Port_MapMemory" | tee logs/entry_symbols.txt

      - name: Empacotar o app (BT3.ipa)
        run: |
          set -e
          # O bundle id e o do app de teste AslrA de proposito: a conta gratuita so cria 10 App IDs a cada 7 dias,
          # e reaproveitar um App ID ja registrado nao gasta um novo.
          APP=ipa/Payload/BT3.app
          mkdir -p "$APP"
          cp port/build/bt3_ios "$APP/bt3_ios"
          if [ -f port/build/bt3_ios.dat ]; then cp port/build/bt3_ios.dat "$APP/bt3_ios.dat"; else echo "::warning::bt3_ios.dat nao foi gerado"; fi
          if [ -f port/build/bt3_ios.mem ]; then cp port/build/bt3_ios.mem "$APP/bt3_ios.mem"; else echo "::warning::bt3_ios.mem nao foi gerado"; fi
          cp -R port/translations "$APP/translations"
          # o icone: gerado aqui (nada de arte do jogo), em 120 e 180 pixels
          mkdir -p icon
          cat > make_icon.py <<'IEOF'
          """O icone do app: gerado aqui, sem imagem de ninguem. Fundo azul-violeta, um brilho laranja e as letras BT3."""
          import os, sys
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          S = 1024
          out = sys.argv[1] if len(sys.argv) > 1 else "."

          # fundo: degrade vertical
          bg = Image.new("RGB", (S, S))
          d = ImageDraw.Draw(bg)
          for y in range(S):
              t = y / (S - 1)
              d.line([(0, y), (S, y)], fill=(int(14 + 52 * t), int(18 - 4 * t), int(56 + 54 * t)))

          # brilho laranja atras das letras
          rg = Image.radial_gradient("L").resize((S, S)).point(lambda v: 255 - v)
          mask = rg.point(lambda v: int((v / 255.0) ** 2.0 * 235))
          bg.paste(Image.new("RGB", (S, S), (255, 138, 20)), (0, 0), mask)

          # faixas de luz (raios) sutis
          rays = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          rd = ImageDraw.Draw(rays)
          import math
          for k in range(12):
              a = math.radians(k * 30 + 8)
              x1, y1 = S / 2 + math.cos(a) * S, S / 2 + math.sin(a) * S
              a2 = a + math.radians(5)
              x2, y2 = S / 2 + math.cos(a2) * S, S / 2 + math.sin(a2) * S
              rd.polygon([(S / 2, S / 2), (x1, y1), (x2, y2)], fill=(255, 190, 80, 28))
          bg = Image.alpha_composite(bg.convert("RGBA"), rays).convert("RGB")

          # letras
          cands = [os.environ.get("BT3_ICON_FONT", ""), "/System/Library/Fonts/Supplemental/Impact.ttf", "/System/Library/Fonts/Supplemental/Arial Black.ttf",
                   "/System/Library/Fonts/Supplemental/Arial Bold.ttf", "/System/Library/Fonts/Helvetica.ttc", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
          font = None
          for c in cands:
              if c and os.path.exists(c):
                  font = ImageFont.truetype(c, 430)
                  break
          if font is None:
              font = ImageFont.load_default()
          txt = "BT3"
          d = ImageDraw.Draw(bg)
          bb = d.textbbox((0, 0), txt, font=font, stroke_width=18)
          w, h = bb[2] - bb[0], bb[3] - bb[1]
          x, y = (S - w) // 2 - bb[0], (S - h) // 2 - bb[1] - 10
          sh = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ImageDraw.Draw(sh).text((x + 10, y + 18), txt, font=font, fill=(0, 0, 0, 170), stroke_width=18, stroke_fill=(0, 0, 0, 170))
          sh = sh.filter(ImageFilter.GaussianBlur(14))
          bg = Image.alpha_composite(bg.convert("RGBA"), sh).convert("RGB")
          d = ImageDraw.Draw(bg)
          d.text((x, y), txt, font=font, fill=(255, 255, 255), stroke_width=18, stroke_fill=(255, 105, 0))

          # o iOS pede icones opacos e quadrados (ele mesmo arredonda os cantos)
          bg.save(os.path.join(out, "AppIcon1024.png"))
          for size, name in ((120, "AppIcon60x60@2x.png"), (180, "AppIcon60x60@3x.png")):
              bg.resize((size, size), Image.LANCZOS).save(os.path.join(out, name))
          print("icones gerados em", out)
          IEOF
          .venv/bin/pip install --quiet --disable-pip-version-check pillow
          .venv/bin/python make_icon.py icon
          cp icon/AppIcon60x60@2x.png icon/AppIcon60x60@3x.png "$APP/"
          cat > "$APP/Info.plist" <<'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>bt3_ios</string>
          <key>CFBundleIdentifier</key><string>com.bt3test.AslrA</string>
          <key>CFBundleName</key><string>BT3</string>
          <key>CFBundleDisplayName</key><string>BT3</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>0.1</string>
          <key>MinimumOSVersion</key><string>14.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
          <key>UILaunchScreen</key><dict/>
          <key>CFBundleIcons</key><dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array></dict></dict>
          <key>UIFileSharingEnabled</key><true/>
          <key>LSSupportsOpeningDocumentsInPlace</key><true/>
          <key>UIRequiresFullScreen</key><true/>
          <key>UIApplicationSupportsIndirectInputEvents</key><true/>
          <key>UIStatusBarHidden</key><true/>
          <key>UIViewControllerBasedStatusBarAppearance</key><false/>
          <key>UISupportedInterfaceOrientations</key><array>
            <string>UIInterfaceOrientationLandscapeLeft</string>
            <string>UIInterfaceOrientationLandscapeRight</string>
          </array>
          </dict></plist>
          PEOF
          (cd ipa && zip -qr ../BT3.ipa Payload)
          ls -la BT3.ipa "$APP"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BT3-ipa
          path: BT3.ipa
          if-no-files-found: error

      - name: Publicar o BT3.ipa em Releases (download direto, sem zip)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-latest BT3.ipa --prerelease --target "${{ github.sha }}" \
            --title "BT3 iOS (ultimo build)" \
            --notes "Build de ${{ github.sha }}. Baixe o BT3.ipa e instale pelo SideStore (Compartilhar -> SideStore)."
          # uma copia permanente deste build (para voltar a uma versao anterior, se uma nova der problema)
          gh release create "build-${{ github.run_number }}" BT3.ipa --prerelease --target "${{ github.sha }}" \
            --title "BT3 iOS build ${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }} (${{ github.sha }})."
          echo "https://github.com/${{ github.repository }}/releases/tag/ios-latest"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bt3_ios
          path: |
            port/build/bt3_ios
            port/build/bt3_ios.dat
            port/build/bt3_ios.map
          if-no-files-found: warn

      - name: Diagnostico dos erros do undefined.py (so se falhou)
        if: failure()
        run: |
          cp port/build/failures.txt logs/failures.txt 2>/dev/null || true
          echo "--- linhas do .i onde o ptr32 parou"
          for pair in plat_mem:347 file:590 btl_obj:1821 hud_b:659; do
            n=${pair%%:*}; l=${pair##*:}
            f=$(find port/build/obj_ios64 \( -name "${n}.i" -o -name "*_${n}.i" \) | head -1)
            echo "== $n ($f) linha $l"
            [ -n "$f" ] && sed -n "$((l-3)),$((l+3))p" "$f" | cut -c1-500
          done | tee logs/ptr32_linhas.txt
          echo "--- primeiros erros completos"
          head -c 6000 port/build/failures.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: logs/
