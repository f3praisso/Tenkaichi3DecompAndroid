name: ios-aslr-test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Escrever o app de teste
        run: |
          mkdir -p t && cd t
          cat > main.m <<'EOF'
          #import <UIKit/UIKit.h>
          #import <mach-o/dyld.h>
          #import <mach-o/loader.h>
          #import <sys/mman.h>
          #import <sys/sysctl.h>
          #import <sys/wait.h>
          #import <unistd.h>
          #import <string.h>
          #import <dlfcn.h>
          #import <errno.h>
          #import <os/proc.h>
          #import <mach/mach.h>
          #import <mach/vm_map.h>

          #define GB4 (4ULL << 30)
          #define L(...) do { [s appendFormat:__VA_ARGS__]; [s appendString:@"\n"]; } while (0)

          typedef int (*init_t)(void **);
          typedef int (*flags_t)(void **, short);
          typedef int (*spawn_t)(pid_t *, const char *, const void *, void *const *, char *const[], char *const[]);

          static int resv(uint64_t addr, uint64_t size) { /* reserva fixa sem acesso, sem sobrescrever; libera em seguida */
            vm_address_t a = (vm_address_t)addr;
            kern_return_t k = vm_map(mach_task_self(), &a, (vm_size_t)size, 0, VM_FLAGS_FIXED, MEMORY_OBJECT_NULL, 0, FALSE, VM_PROT_NONE, VM_PROT_READ | VM_PROT_WRITE, VM_INHERIT_DEFAULT);
            if (k == KERN_SUCCESS) { vm_deallocate(mach_task_self(), a, (vm_size_t)size); return 0; }
            return (int)k;
          }

          static NSString *report(void) {
            NSMutableString *s = [NSMutableString string];
            char model[64] = "?"; size_t ml = sizeof model;
            sysctlbyname("hw.machine", model, &ml, NULL, 0);
            L(@"%s  iOS %@", model, UIDevice.currentDevice.systemVersion);
          {
            NSString *m = [NSUserDefaults.standardUserDefaults stringForKey:@"m6"];
            if (m && ![m isEqualToString:@"concluido"]) L(@"!! o teste 6 anterior travou no passo: %@", m);
          }
            L(@"");

            const struct mach_header *h = _dyld_get_image_header(0);
            intptr_t slide = _dyld_get_image_vmaddr_slide(0);
            uint64_t hv = (uint64_t)(uintptr_t)h;
            L(@"1) Onde o programa foi carregado");
            L(@"  cabecalho: 0x%llx", hv);
            L(@"  slide ASLR: 0x%lx", (long)slide);
            L(@"  endereco de ligacao: 0x%llx", hv - (uint64_t)slide);
            L(@"  32 bits baixos do cabecalho: 0x%08llx", hv & 0xFFFFFFFFULL);
            L(@"  janela alinhada em 4 GB: %@", ((hv - 0x20000000ULL) & 0xFFFFFFFFULL) == 0 ? @"SIM" : @"NAO");
            L(@"");

            L(@"2) Reservas com endereco FIXO (4 GB cada, multiplos de 4 GB)");
          {
            int prev = 0; uint64_t from = 1;
            for (uint64_t k = 1; k <= 0x80; k++) {
              int ok = (k < 0x80) && resv(k << 32, GB4) == 0;
              if (k == 1) { prev = ok; continue; }
              if (ok != prev || k == 0x80) {
                L(@"  0x%llx - 0x%llx: %@", from << 32, k << 32, prev ? @"livre" : @"ocupado/recusado");
                from = k; prev = ok;
              }
            }
          }
          L(@"  maior reserva unica em qualquer lugar:");
          for (uint64_t g = 4; g <= 8; g++) {
            vm_address_t a = 0;
            kern_return_t kr = vm_map(mach_task_self(), &a, (vm_size_t)(g << 30), 0, VM_FLAGS_ANYWHERE, MEMORY_OBJECT_NULL, 0, FALSE, VM_PROT_NONE, VM_PROT_READ | VM_PROT_WRITE, VM_INHERIT_DEFAULT);
            if (kr == KERN_SUCCESS) { L(@"    %llu GB: ok em 0x%llx", g, (uint64_t)a); vm_deallocate(mach_task_self(), a, (vm_size_t)(g << 30)); }
            else L(@"    %llu GB: falhou (%d)", g, (int)kr);
          }
          L(@"");

          L(@"3) Reiniciar sem ASLR (posix_spawn)");
            init_t ai = (init_t)dlsym(RTLD_DEFAULT, "posix_spawnattr_init");
            flags_t af = (flags_t)dlsym(RTLD_DEFAULT, "posix_spawnattr_setflags");
            spawn_t sp = (spawn_t)dlsym(RTLD_DEFAULT, "posix_spawn");
            if (!ai || !af || !sp) {
              L(@"  funcoes nao encontradas");
            } else {
              void *attr = NULL; ai(&attr); af(&attr, 0x100);
              NSString *exe = NSBundle.mainBundle.executablePath;
              char *argv[] = { (char *)exe.fileSystemRepresentation, "--child", NULL };
              char *envp[] = { NULL };
              pid_t pid = 0;
              int rc = sp(&pid, argv[0], NULL, &attr, argv, envp);
              L(@"  resultado: %d (%s)", rc, rc ? strerror(rc) : "ok");
            }
            L(@"");

            L(@"4) Memoria");
            uint64_t mem = 0; size_t len = sizeof mem;
            sysctlbyname("hw.memsize", &mem, &len, NULL, 0);
            L(@"  pagina: %d bytes", (int)getpagesize());
            L(@"  RAM: %llu MB", mem >> 20);
            L(@"  disponivel ao app: %lu MB", (unsigned long)(os_proc_available_memory() >> 20));
            L(@"");
          L(@"5) Janela W = cabecalho - 0x20000000 (sem exigir alinhamento)");
          {
            uint64_t W = hv - 0x20000000ULL;
            L(@"  W = 0x%llx", W);
            if (W < 0x100000000ULL) {
              L(@"  W abaixo de 4 GB: area proibida do programa");
            } else {
              L(@"  [W+0x00100000, +0x1EF00000): %@", resv(W + 0x00100000ULL, 0x1EF00000ULL) == 0 ? @"livre" : @"ocupado");
              L(@"  [W+0x30000000, +0x41000000): %@", resv(W + 0x30000000ULL, 0x41000000ULL) == 0 ? @"livre" : @"ocupado");
            }
          }
          return s;
          }

          static volatile int gShared = 5;
          __attribute__((noinline)) int probe42(void) { return 42; }
          __attribute__((noinline)) int readShared(void) { return gShared; }
          __attribute__((noinline)) void writeShared(int v) { gShared = v; }

          static void mark(const char *step) {
            [NSUserDefaults.standardUserDefaults setObject:@(step) forKey:@"m6"];
            [NSUserDefaults.standardUserDefaults synchronize];
          }

          typedef struct { uint64_t vm, size; char name[17]; } Seg;

          /* Teste 6: janela alinhada separada + espelho do proprio programa dentro dela (vm_remap), e chamar codigo pelo espelho */
          static NSString *mirrorTest(void) {
            NSMutableString *s = [NSMutableString string];
            const struct mach_header_64 *h = (const struct mach_header_64 *)_dyld_get_image_header(0);
            intptr_t slide = _dyld_get_image_vmaddr_slide(0);
            Seg seg[8]; int n = 0;
            uint64_t lo = ~0ULL;
            const uint8_t *p = (const uint8_t *)(h + 1);
            for (uint32_t i = 0; i < h->ncmds; i++) {
              const struct load_command *lc = (const struct load_command *)p;
              if (lc->cmd == LC_SEGMENT_64) {
                const struct segment_command_64 *sc = (const struct segment_command_64 *)lc;
                if (strcmp(sc->segname, "__PAGEZERO") && strcmp(sc->segname, "__LINKEDIT") && n < 8) {
                  seg[n].vm = sc->vmaddr + (uint64_t)slide; seg[n].size = sc->vmsize;
                  memcpy(seg[n].name, sc->segname, 16); seg[n].name[16] = 0;
                  if (seg[n].vm < lo) lo = seg[n].vm;
                  n++;
                }
              }
              p += lc->cmdsize;
            }
            L(@"6) Janela alinhada separada + espelho do programa");
            for (int i = 0; i < n; i++) L(@"  segmento %s: 0x%llx, %llu KB", seg[i].name, seg[i].vm, seg[i].size >> 10);

            mark("reservar 6 GB");
            vm_address_t base = 0; vm_size_t total = (vm_size_t)(6ULL << 30);
            kern_return_t kr = vm_map(mach_task_self(), &base, total, 0, VM_FLAGS_ANYWHERE, MEMORY_OBJECT_NULL, 0, FALSE, VM_PROT_NONE, VM_PROT_READ | VM_PROT_WRITE, VM_INHERIT_DEFAULT);
            if (kr != KERN_SUCCESS) { L(@"  reserva de 6 GB falhou (%d)", (int)kr); mark("concluido"); return s; }
            uint64_t W = ((uint64_t)base + GB4 - 1) & ~(GB4 - 1);
            uint64_t after = (uint64_t)base + total - W;
            L(@"  reserva 0x%llx, W alinhado = 0x%llx, sobram %llu MB depois de W", (uint64_t)base, W, after >> 20);
            if (after < 0x80000000ULL) { L(@"  nao sobram 2 GB depois de W"); mark("concluido"); return s; }

            uint64_t alias0 = W + 0x20000000ULL;
            for (int i = 0; i < n; i++) {
              mark(seg[i].name);
              vm_address_t dst = (vm_address_t)(alias0 + (seg[i].vm - lo));
              vm_prot_t cur = 0, mx = 0;
              kr = vm_remap(mach_task_self(), &dst, (vm_size_t)seg[i].size, 0, VM_FLAGS_FIXED | VM_FLAGS_OVERWRITE, mach_task_self(), (vm_address_t)seg[i].vm, FALSE, &cur, &mx, VM_INHERIT_NONE);
              L(@"  espelhar %s em 0x%llx: %@ (cur=%d max=%d)", seg[i].name, (uint64_t)dst, kr == KERN_SUCCESS ? @"OK" : [NSString stringWithFormat:@"FALHOU %d", (int)kr], (int)cur, (int)mx);
              if (kr != KERN_SUCCESS) { mark("concluido"); return s; }
            }

            typedef int (*fn0)(void);
            mark("chamar probe42 pelo espelho");
            int r = ((fn0)(alias0 + ((uintptr_t)probe42 - lo)))();
            L(@"  probe42 pelo espelho: %d (esperado 42)", r);

            gShared = 77;
            mark("chamar readShared pelo espelho");
            r = ((fn0)(alias0 + ((uintptr_t)readShared - lo)))();
            L(@"  readShared pelo espelho: %d (esperado 77 se os dados sao compartilhados)", r);

            mark("chamar writeShared pelo espelho");
            ((void (*)(int))(alias0 + ((uintptr_t)writeShared - lo)))(99);
            L(@"  gShared no original apos writeShared(99) pelo espelho: %d (esperado 99)", (int)gShared);
            mark("concluido");
            return s;
          }

          @interface VC : UIViewController
          @property (strong) UITextView *tv;
          @end
          @implementation VC
          - (void)viewDidLoad {
            [super viewDidLoad];
            self.view.backgroundColor = UIColor.blackColor;
            UITextView *t = [[UITextView alloc] initWithFrame:self.view.bounds];
            t.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
            t.backgroundColor = UIColor.blackColor;
            t.textColor = UIColor.greenColor;
            t.editable = NO;
            t.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
            t.textContainerInset = UIEdgeInsetsMake(50, 8, 90, 8);
            t.text = report();
            [self.view addSubview:t];
            self.tv = t;
            UIButton *b = [UIButton buttonWithType:UIButtonTypeSystem];
            [b setTitle:@"Rodar teste 6 (espelhar o programa)" forState:UIControlStateNormal];
            b.titleLabel.font = [UIFont boldSystemFontOfSize:16];
            b.frame = CGRectMake(0, self.view.bounds.size.height - 80, self.view.bounds.size.width, 44);
            b.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleTopMargin;
            [b addTarget:self action:@selector(run6) forControlEvents:UIControlEventTouchUpInside];
            [self.view addSubview:b];
          }
          - (void)run6 {
            NSString *r = mirrorTest();
            self.tv.text = [self.tv.text stringByAppendingFormat:@"\n%@", r];
            [self.tv scrollRangeToVisible:NSMakeRange(self.tv.text.length - 1, 1)];
          }
          @end

          @interface AD : UIResponder <UIApplicationDelegate>
          @property (strong) UIWindow *window;
          @end
          @implementation AD
          - (BOOL)application:(UIApplication *)a didFinishLaunchingWithOptions:(NSDictionary *)o {
            self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
            self.window.rootViewController = [VC new];
            [self.window makeKeyAndVisible];
            return YES;
          }
          @end

          int main(int argc, char *argv[]) {
            if (argc > 1 && !strcmp(argv[1], "--child")) return 0;
            @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AD"); }
          }
          EOF
          cat > Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>__NAME__</string>
          <key>CFBundleIdentifier</key><string>com.bt3test.__NAME__</string>
          <key>CFBundleName</key><string>__NAME__</string>
          <key>CFBundleDisplayName</key><string>__NAME__</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>MinimumOSVersion</key><string>14.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UILaunchScreen</key><dict/>
          <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
          </dict></plist>
          EOF

      - name: Compilar e empacotar (AslrA normal, AslrB com TEXT em 0x1020000000)
        run: |
          cd t
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          build() {
            name=$1; shift
            mkdir -p "out/$name/Payload/$name.app"
            xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 -fobjc-arc -isysroot "$SDK" \
              main.m -framework UIKit -framework Foundation -o "out/$name/Payload/$name.app/$name" "$@" || return 1
            sed "s/__NAME__/$name/g" Info.plist > "out/$name/Payload/$name.app/Info.plist"
            (cd "out/$name" && zip -qr "../$name.ipa" Payload)
            echo "== $name"; file "out/$name/Payload/$name.app/$name"
            otool -l "out/$name/Payload/$name.app/$name" | grep -A3 "segname __TEXT" | head -4
          }
          build AslrA
          # AslrB: como o link.py do port de macOS, cada segmento recebe um endereco (-segaddr), mantendo as distancias
          otool -l out/AslrA/Payload/AslrA.app/AslrA | awk '/segname/{n=$2} /vmaddr/{if(n!=""){print n, $2; n=""}}' > segs.txt
          cat segs.txt
          FIRST=$(awk '$1=="__TEXT"{print $2}' segs.txt)
          FLAGS=()
          while read -r seg addr; do
            case "$seg" in __PAGEZERO|__LINKEDIT) continue;; esac
            FLAGS+=("-Wl,-segaddr,$seg,$(printf '0x%x' $(( 0x1020000000 + addr - FIRST )))")
          done < segs.txt
          echo "flags: ${FLAGS[@]}"
          # sem "chained fixups" (o ld recente quebra com -segaddr nelas); o port de macOS usa target 11, que ja evita isso
          build AslrB "${FLAGS[@]}" -Wl,-no_fixup_chains \
            || build AslrB "${FLAGS[@]}" -Wl,-no_fixup_chains -miphoneos-version-min=12.0 \
            || echo "::warning::AslrB nao ligou com -segaddr (veja o log acima)"
          ls -la out/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipas
          path: t/out/*.ipa
          if-no-files-found: error
